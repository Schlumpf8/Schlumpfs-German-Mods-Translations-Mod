[item-group-name]
ammo=Munition

[mod-setting-name]
khaosammogroup-advanced-icon-color-magazine-1=[color=orange][font=heading-2]Erweitert[/font][/color] Farbe des Gruppensymbols – Magazin 1
khaosammogroup-advanced-icon-color-magazine-2=[color=orange][font=heading-2]Erweitert[/font][/color] Farbe des Gruppensymbols – Magazin 2
khaosammogroup-advanced-icon-color-bullets=[color=orange][font=heading-2]Erweitert[/font][/color] Farbe des Gruppensymbols – Kugeln
khaosammogroup-disable-new-subgroups=[color=green][font=heading-2]Kompatibilität[/font][/color] Neue Munitionsuntergruppen deaktivieren

[mod-setting-description]
khaosammogroup-disable-new-subgroups=Wenn diese Option aktiviert ist, wird die gesamte Munition in die Standard-Munition-Untergruppe eingeordnet und es werden durch diesen Mod keine neuen Munition-Untergruppen hinzugefügt. Dies ist nützlich für die Kompatibilität mit anderen Mods, die ähnliche Untergruppen hinzufügen und dadurch Konflikte und Abstürze beim Start verursachen.

[mod-name]
khaosammogroup=QuingKhaos' Ammo Group

[mod-description]
khaosammogroup=Fügt dem Crafting-Menü eine neue Munitionsgruppe hinzu. Direkter Ersatz für BlacklightSoranes „AmmoGroup“ für Version 2.1, unterstützt auch Version 2.0.