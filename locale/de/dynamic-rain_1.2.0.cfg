[dynamic-rain]
radar-lightning-disrupted=Durch Blitzeinschlag gestört

[mod-setting-description]
rain-enabled=Aktiviert oder deaktiviert das Wetter, die Grafik, die Sounds und die Spieleffekte von „Dynamic Rain“
rain-allowed-planets=Durch Kommas getrennte interne Planeten- oder Oberflächennamen, auf denen Regen zulässig ist. Bei den Namen wird zwischen Groß- und Kleinschreibung unterschieden. Verwenden Sie für die Weltraumerkundung den Zonennamen, zum Beispiel: nauvis, Foenestra, Foenestra Orbit
rain-wet-min-minutes=Minimale possible rain duration in minutes
rain-wet-max-minutes=Maximal mögliche Regendauer in Minuten
rain-wet-power=Steuert, ob Regenereignisse eher kürzer oder länger ausfallen. 1 bedeutet gleichmäßige Verteilung. Höhere Werte begünstigen kürzeren Regen, während niedrigere Werte längeren Regen begünstigen
rain-dry-mean-minutes=Durchschnittliche Trockenzeit zwischen Regenereignissen in Minuten. Niedrigere Werte lassen Regen häufiger auftreten
rain-intensity=Hauptmultiplikator für die visuelle Dichte. Höhere Werte lassen den Regen dichter werden, kosten aber mehr UPS.
min-thunder-chance=Grundwahrscheinlichkeit für Donner. Niedrigere Werte lassen Donner seltener auftreten.
max-thunder-chance=Spitzenwahrscheinlichkeit für Donner. Höhere Werte lassen Donner zu Spitzenzeiten häufiger auftreten.
lightning-visual-enabled=Blitze erhellen kurzzeitig die Umgebung. Hat keinen Einfluss auf Blitze oder Donnergeräusche.
lightning-strike-chance=Wahrscheinlichkeit, dass jedes Gewitterereignis auf einem Planeten einen physischen Blitzeinschlag am Boden verursacht. 0 = keine Einschläge; 1 = bei jedem Ereignis. Erfordert "Space Age". Hat keinen Einfluss auf Blitze oder Donnergeräusche.
lightning-player-protection-minutes=Zu Beginn eines Spiels auf Nauvis schlägt der Blitz nicht direkt in den Spieler ein.
thunder-sound-enabled=Spielt Donnergernäusche vor und während des Regens ab. Blitzgeräusche können aktiviert bleiben, wenn diese Option deaktiviert ist.
rain-volume-modifier=Lautstärkemultiplikator für Regen von 0 bis 1
thunder-volume-modifier=Lautstärkemultiplikator für Donner von 0 bis 1
fire-extinguish-chance=Wahrscheinlichkeit, dass Regen ein Feuer löscht. 0: nie, 1: immer
rain-solar-power-multiplier=Solarwirkungsgrad bei Regen, in Prozent.\n-1 = keine Auswirkung;\n50 % = halber Wirkungsgrad;\n100 % = voller Wirkungsgrad;\n0 % = kein Strom;
rain-pollution-cleanup-per-minute=Beseitigung von Umweltverschmutzung pro Chunk pro Minute (Umweltverschmutzung / m), während es regnet.\n0 = deaktiviert
rain-pollution-max-chunks-per-tick=Maximale Anzahl an Chunks, die pro Tick auf Verschmutzungsbeseitigung überprüft werden. Niedrigere Werte verbessern die Leistung; auf großen Karten kann dies jedoch zu einer geringeren Genauigkeit bei der Beseitigung führen

[dynamic-rain-command]
help=Wetter anzeigen oder ändern; Wetterstatistiken anzeigen; Debug-Overlays für „Dynamic Rain“ umschalten
usage=Verwendung: /dynamic-rain status | rain | dry | debug | stat | lightning X Y
lightning-usage=Verwendung: /dynamic-rain lightning X Y – zwei Zahlen zwischen -1000000 und 1000000.
lightning-unavailable=Zum Erzeugen von Blitzen sind „Space Age“ und eine Planetenoberfläche erforderlich.
debug-on=„Dynamic Rain“-Debug aktiviert.
debug-off=„Dynamic Rain“-Debug deaktiviert.
admin-only=Nur Administratoren können das Wetter ändern.
disabled=„Dynamic Rain“ ist deaktiviert.
unsupported=„Dynamic Rain“ ist auf __1__ nicht aktiviert.
status=„Dynamic Rain“: __1__ auf __2__, noch __3__ Minuten und __4__ Sekunden verbleibend.
wet=nass
dry=trocken
started=„Dynamic Rain“: Periode __1__ begann am __2__.
already-active=„Dynamic Rain“: Periode __1__ ist bereits aktiv am __2__.

