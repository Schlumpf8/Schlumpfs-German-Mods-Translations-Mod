[mod-setting-name]
fill4me-maximum-fuel-value=Maximalwert für Treibstoff
fill4me-maximum-ammo-value=Maximaler Schaden der Munition

fill4me-refill-ignores-range-limit=Reichweite beim Nachfüllen ignorieren

fill4me-ignore-ammo-radius=Munitionradius ignorieren

fill4me-ammo-load-limit=Munitionsladung, Begrenzung durch
fill4me-ammo-load-percent=Munitionsladung, Prozent
fill4me-ammo-load-count=Munitionsladung, Anzahl

fill4me-blacklist-fuel=Fill4Me Treibstoff Blacklist
fill4me-blacklist-ammo=Fill4Me Munition Blacklist

[mod-setting-description]
fill4me-maximum-fuel-value=Keine Treibstoffe automatisch in Objekte laden, wenn deren Treibstoffwert den angegebenen Wert überschreitet.  Raketentreibstoff beträgt 100000000 (100 Millionen).  Festbrennstoff beträgt 12000000 (12 Millionen).  Verwende 0, um alle zu laden.
fill4me-maximum-ammo-value=Lade keine Munition automatisch in Objekte, wenn deren Schadenswert den angegebenen Wert überschreitet.  Es wird nicht zwischen Artillerie und Kugeln unterschieden.  Mit Vorsicht verwenden.  Verwende 0, um jede Art von Munition zu laden.
fill4me-refill-ignores-range-limit=Wenn aktiviert, wird das ursprüngliche Verhalten dieses Mods wiederhergestellt, sodass du jeden Turm/jedes Fahrzeug nachladen kannst, egal wie weit entfernt er/es ist.  Wenn deaktiviert, können Türme außerhalb der Reichweite „offen oder zugänglich“ erst nachgeladen werden, wenn du dich näherst.

fill4me-ignore-ammo-radius=Aktivieren Sie diese Option, um den mit der Munition verbundenen Radius beim Nachladen von Geschütztürmen zu ignorieren.  HINWEIS: Dies kann dazu führen, dass ein Geschützturm auf Ziele schießt, die zu nah sind, und sich dadurch selbst beschädigt oder zerstört.

fill4me-ammo-load-limit=Wähle die Methode aus, nach der die in Geschütztürme/Waffen geladene Munitionsmenge begrenzt werden soll.  „Prozent“ lädt Munition bis zu einem maximalen Prozentsatz dessen, was du in deinem Inventar hast.  „Anzahl“ lädt Munition bis zu einer bestimmten Anzahl.  „Beides“ wählt den niedrigeren der beiden Werte, also entweder den Prozentsatz oder die Anzahl.
fill4me-ammo-load-percent=Prozentsatz der verfügbaren Munition, der in den Geschützturm geladen werden soll, bei prozentbasierter Beladung.
fill4me-ammo-load-count=Maximale Stückzahl, die in den Geschützturm geladen werden soll, bei stückzahlbasierter Beladung.

fill4me-blacklist-fuel=Gib die internen Namen der Brennstoffquellen durch Kommas getrennt ein. Verwende den Befehl "/f4m.list_fuel" um Brennstoffquellen aufzulisten.  Beispiel: "small-electric-pole,wood"
fill4me-blacklist-ammo=Gib interne Namen für Munition ein, getrennt durch Kommas. Verwende den Befehl "/f4m.list_ammo" um Munition aufzulisten.  Beispiel: "firearm-magazine,rocket"

[string-mod-setting]
fill4me-ammo-load-limit-percent=Prozent
fill4me-ammo-load-limit-count=Anzahl
fill4me-ammo-load-limit-both=Beides (Prozent & Anzahl)

[shortcut-name]
fill4me-blacklist-button=Fill4Me-Blacklist anwenden
