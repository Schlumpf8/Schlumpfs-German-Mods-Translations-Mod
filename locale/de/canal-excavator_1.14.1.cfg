[item-description]
canex-excavator=Gräbt mit dem [item=canex-digable] vorbereitete Oberflächen ab, damit Wasser abfließen kann. Weitere Details findest du unter „Tipps und Tricks“.
canex-digable=Markiert den Boden als aushubfähig für den [item=canex-excavator].

