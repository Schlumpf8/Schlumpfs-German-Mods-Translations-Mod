[command]
canex-transition-dug=Erzwingt den Übergang für alle Kacheln, die für einen Übergang registriert sind. Kann Fälle beheben, in denen der Übergang aus irgendeinem Grund übersehen wurde.
canex-reset-partially-dug=Alle Kacheln, die teilweise ausgegraben, dann aber abgebrochen wurden, werden in einer Tabelle gespeichert, die bei häufiger Wiederholung sehr groß werden kann. Dieser Befehl leert diese Tabelle.
canex-debug=[surfaceName] - Zeigt den Status aller ausgegrabenen, für den Übergang registrierten und teilweise ausgegrabenen Kacheln an.
canex-show-surface-config=[surfaceName] - Zeigt die Konfiguration einer/aller Oberflächen an.
canax-remove-floating=Entfernt alle ausgegrabenen Ressourcen, unter denen sich keine ausgrabbare Kachel befindet. Dies kann auftreten, wenn ein anderer Mod die Kachel entfernt, ohne meinen Mod darüber zu verständigen.

[tips-and-tricks-item-description]
canex-excavator-tnt=Um den [entity=canex-excavator] zu bauen, musst du zunächst [item=canex-digable] acheln platzieren und den Bagger darauf errichten.
canex-canals-tnt=Nachdem der [entity=canex-excavator] alle Ressourcen aus dem [item=canex-digable] abgebaut hat, verwandeln sich die ausgegrabenen Kacheln neben einer Wasserquelle in Wasserkacheln.\nEs können nicht nur Kanäle mit [tile=water] ausgegraben werden. Der Wassertyp der Quelle wird übernommen.
canex-canals-sa-tnt=\nAuf verschiedenen Planeten können beim Abbau unterschiedliche Ergebnisse erzielt werden. Beim Ausheben auf [planet=gleba] entsteht beispielsweise [item=spoilage].

