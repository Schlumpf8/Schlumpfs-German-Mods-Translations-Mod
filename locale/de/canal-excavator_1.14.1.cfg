[mod-setting-name]
auto-deconstruct=Automatischer Abbau
no-tiles=Keine neuen Kacheln hinzufügen

[mod-setting-description]
auto-deconstruct=Ein Objekt wird automatisch zum Abriss markiert, wenn die darunterliegende Kachel zum Abbau markiert ist.
no-tiles=Factorio hat eine Obergrenze von 255 Kachelprototypen. Einige Mods wie „Alien Biomes“ fügen eine Vielzahl von Kacheln hinzu, was dazu führen kann, dass du die Grenze von 255 erreichst. Standardmäßig fügt dieser Mod zwei Kacheln hinzu: „Ausgrabbar“ und „Ausgegraben“. Wenn diese Einstellung aktiviert ist, verwendet der Mod Factorios „Gelber veredelter Beton“ für „Ausgrabbar“ und „Brauner veredelter Beton“ für „Ausgegraben“. Sofern kein anderer von dir verwendeter Mod diese beiden Kacheltypen verändert, handelt es sich bei dieser Einstellung um eine rein kosmetische Änderung.

