[technology-description]
boompuff-agriculture=Verwende Dröhnquast-Sporen als Saatgut, um Dröhnquaste anzubauen… das könnte unklug sein.
boompuff-awareness=Du bist dir bewusst, dass ein Dröhnquast explodiert. Reduziert die Explosionswahrscheinlichkeit von gepflanzten Dröhnquaste auf 80 %.
boompuff-handling=Du gehst beim Umgang mit Dröhnquasten mit einer gewissen Vorsicht vor. Verringert die Explosionswahrscheinlichkeit gepflanzter Dröhnquaste auf 60 %.
boompuff-methodology=Du hältst dich beim Umgang mit Dröhnquasten an Sicherheitsvorschriften. Verringert die Explosionswahrscheinlichkeit gepflanzter Dröhnquaste auf 40 %.
boompuff-expert=Du bist ein versierter Boompuff-Züchter, aber niemand ist perfekt. Verringert die Explosionswahrscheinlichkeit von gepflanzten Dröhnquaste auf 2 %.
boompuff-ascension=Du denkst wie ein Boompuff. Du bist ein Boompuff. Dröhnquasten explodieren nicht, wenn du sie erntest.