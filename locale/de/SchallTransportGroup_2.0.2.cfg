[item-group-name]
transport=Transport

[mod-setting-name]
Schall-TGP-order=Reihenfolge der Gruppenregisterkarten

[mod-setting-description]
Schall-TGP-order=av: (Standard) Nach der Registerkarte „Logistik“.\ndv: Nach der Registerkarte „Kampf“.

[mod-name]
SchallTransportGroup=Schall Transport Group

[mod-description]
SchallTransportGroup=Stellt eine separate neue Registerkarte „Transport“ bereit, die alle Standardfahrzeuge und alle Gegenstände enthält, die bereits zur Standard-Transportuntergruppe gehören.\nDient als Rahmen, um alle transportbezogenen Gegenstände zusammenzufassen.\nEntwickelt für Spieler, bei denen zahlreiche Fahrzeug-Mods die Registerkarte „Logistik“ überladen.
