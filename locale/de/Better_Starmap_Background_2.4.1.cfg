asteroid-belt-1-enabled=Ob der Asteroidengürtel zwischen Fulgora und Aquilo aktiviert werden soll.
asteroid-belt-2-enabled=Ob der Asteroidengürtel zwischen dem Rand des Sonnensystems und den zerbrochenen Planeten aktiviert werden soll.