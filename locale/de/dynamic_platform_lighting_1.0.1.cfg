dynamic_platform_brightness=Helligkeit
dynamic_platform_always_dark=Immer dunkel
dynamic_platform_lut=Farben der Weltraumplattform
dynamic_platform_solar_limit=Solarenergie-Obergrenze
dynamic_platform_max_dark_lut=Tiefste Dunkelheit
dynamic_platform_solar_min=Solarenergie-Untergrenze

[mod-setting-description]
dynamic_platform_brightness=Legt fest, wie hell eine Plattform werden kann. 100 bedeutet, dass die Plattform so hell ist wie der sonnigste Planet, 25 sorgt dafür, dass jeder Planet nur ein Viertel so hell ist.
dynamic_platform_always_dark=Ignoriert die Menge an Sonnenenergie und hält Plattformen stets dunkel.
dynamic_platform_lut=Wählt die Plattformfarben aus, die für jede Umlaufbahn verwendet werden. Die Standardeinstellung (Dynamisch) behält die Farben des Planeten bei, den die Plattform umkreist.
dynamic_platform_solar_limit=Begrenzt die im Weltraum verfügbare Sonnenenergie, die zur Skalierung der Helligkeit verwendet wird. Ohne eine Begrenzung legt ein einzelner extrem heller Planet oder eine Umlaufbahn (zum Beispiel Moshine mit 60.000 Sonnenenergie im Weltraum) den Maßstab für jede Plattform fest und macht alle anderen Plattformen sehr dunkel.\ nSolarenergie oberhalb des Grenzwerts zählt als Grenzwert, sodass jeder Himmelskörper, der diesen Wert erreicht oder überschreitet, die volle Helligkeit erhält. Bei einem Grenzwert von 600 ist Vulcanus (600 Solarenergie im Weltraum) der hellste Himmelskörper und Moshine genau so hell wie Vulcanus.\n[font=default-bold] Dies ist nur visuell: Es ändert nichts an der tatsächlichen Solarenergie im Weltraum eines Planeten oder einer Umlaufbahn, sodass Solarpaneele davon unberührt bleiben.\n0 deaktiviert den Grenzwert. [/font]
dynamic_platform_max_dark_lut=Fügt eine extrem dunkle Farbpalette auf der Umlaufbahn hinzu, auf der die Solarenergie im Weltraum 0 oder nahezu 0 beträgt.
dynamic_platform_solar_min=Solarenergie im Weltraum unterhalb dieses Wertes wird als dieser gewertet, sodass das dunkelste Ende der Skala bei diesem Wert statt bei 0 beginnt. Der Standardwert 60 entspricht Aquilo, dem dunkelsten Planeten.

