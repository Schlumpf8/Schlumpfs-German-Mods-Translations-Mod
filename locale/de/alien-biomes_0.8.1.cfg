[mod-setting-description]
alien-biomes-terrain-scale=Vergrößert oder verkleinert die Größe der Biome. Niedrigere Werte erzeugen kleinere, häufiger vorkommende Biome. Der Standardwert ist 100.
alien-biomes-temperature-low=Die unteren Temperaturextreme des Planeten. Verringern Sie diesen Wert, um mehr gefrorenen Schnee und Eis hinzuzufügen. Erhöhen Sie ihn, um gefrorene Gebiete seltener oder gar unmöglich zu machen. Der Standardwert ist -50.
alien-biomes-temperature-high=Die oberen Temperaturextreme des Planeten. Erhöhen Sie diesen Wert, um mehr vulkanische Gebiete hinzuzufügen. Verringern Sie ihn, um vulkanische Gebiete seltener oder gar unmöglich zu machen. Der Standardwert ist 150.
alien-biomes-humidity-low=Die unteren Extremwerte der Luftfeuchtigkeit auf dem Planeten. Verringern Sie diesen Wert, um mehr Wüsten hinzuzufügen. Erhöhen Sie ihn, um Wüstengebiete seltener oder gar nicht mehr vorkommen zu lassen. Der Standardwert ist 0.
alien-biomes-humidity-high=Die oberen Extremwerte der Luftfeuchtigkeit auf dem Planeten. Erhöhen Sie diesen Wert, um mehr Grasflächen hinzuzufügen. Verringern Sie ihn, um Grasflächen seltener oder gar nicht mehr vorkommen zu lassen. Der Standardwert ist 100.
alien-biomes-aux-low=Die unteren Extreme der Farbvariation auf dem Planeten. Verringere diesen Wert, um mehr Grün-, Braun- und Beigetöne hinzuzufügen. Erhöhe diesen Wert, um Grün-, Braun- und Beigetöne seltener werden zu lassen. Der Standardwert ist 0.
alien-biomes-aux-high=Die oberen Extreme der Farbvariation auf dem Planeten. Erhöhen Sie diesen Wert, um mehr Blau-, Violett- und Rottöne hinzuzufügen. Verringern Sie ihn, um Blau-, Violett- und Rottöne seltener erscheinen zu lassen. Der Standardwert ist 100.
alien-biomes-disable-vegetation=Wenn aktiviert, werden alle Grasflächen, Bäume und pflanzlichen Dekorationselemente entfernt (sofern sie nicht durch einen anderen Mod hinzugefügt wurden). Damit können Sie einen toten Planeten, Mond oder Asteroiden simulieren.
alien-biomes-reduced-tiles=Reduzierte Kachelvarianten
tile-speed-reduction=Einige Kacheln (wie heißes vulkanisches Gelände) verringern die Geschwindigkeit des Spielers. Eine Verringerung dieses Wertes bedeutet, dass das Gelände dich weniger verlangsamt.
