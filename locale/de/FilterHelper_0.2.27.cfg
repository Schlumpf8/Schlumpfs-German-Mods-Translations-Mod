[fh]
button-tooltip=__1__\n__CONTROL__pipette__ to pipette into cursor.\n__2__
tooltip-filters=__CONTROL_LEFT_CLICK__ to set filter.\n__CONTROL_RIGHT_CLICK__ to remove filter.
tooltip-container-filters=__CONTROL_LEFT_CLICK__ to set filter.\n__CONTROL_RIGHT_CLICK__ to remove filter.\n__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ to set filter under all of this item.\n__CONTROL_KEY_CTRL__ + __CONTROL_LEFT_CLICK__ to set this filter on all valid slots.\n__CONTROL_KEY_CTRL__ + __CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ to set this filter on [font=default-bold]all[/font] slots.\n(__CONTROL_KEY_SHIFT__ or __CONTROL_KEY_CTRL__) + __CONTROL_RIGHT_CLICK__ to remove this filter from all slots.
tooltip-requests=__CONTROL_LEFT_CLICK__ to increase request by 1 stack.\n__CONTROL_RIGHT_CLICK__ to decrease request by 1 stack.\n__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ to increase request by 5 stacks.\n__CONTROL_KEY_SHIFT__ + __CONTROL_RIGHT_CLICK__ to decrease request by 5 stacks.\n__CONTROL_KEY_CTRL__ + __CONTROL_LEFT_CLICK__ to set request to fill container.\n__CONTROL_KEY_CTRL__ + __CONTROL_RIGHT_CLICK__ to remove request.
filters-full=Filter voll
filters-empty=Filter leer
requests-full=Anfragen voll
requests-empty=Anfragen leer

[mod-setting-name]
fh-set-filter-on-inserter=Filter beim Einstellen des Filters für den Greifarm aktivieren
fh-default-item-on-splitter=Ein Item festlegen, das auf Splitter immer angezeigt wird
fh-add-fuel-items=Kompatible Brennstoffgegenstände zu Filtern hinzufügen
fh-show-only-unlocked-qualities=Nur Ergebnisqualitäten für freigeschaltete Qualitäten anzeigen

[mod-setting-description]
fh-set-filter-on-inserter=Aktiviert das Kontrollkästchen „Filter anwenden" , wenn ein Filter für einen Greifarm festgelegt wird
fh-default-item-on-splitter=Name eines Gegenstands, der immer auf Splittern angezeigt werden soll, z.B. „deconstruction-planner“. Leer lassen, um die Funktion zu deaktivieren.
fh-add-fuel-items=Fügt kompatible Brennstoffe und deren Ergebnisse hinzu, auch wenn sie nicht in den Ein- und Ausgängen zu sehen sind
fh-show-only-unlocked-qualities=Eine Fabrik mit Qualitätsmodulen zeigt in den Ergebnisfiltern keine Qualitäten an, die über die erforschten hinausgehen