[mod-setting-name]
inserter-throughput-enabled=Aktiviert
inserter-throughput-rounding-precision=Rundungsgenauigkeit
inserter-throughput-show-toggle=Umschaltfläche anzeigen

[mod-setting-description]
inserter-throughput-enabled=Legt fest, ob der Durchsatz des Greifarms angezeigt werden soll.
inserter-throughput-rounding-precision=Maximale Anzahl der nach dem Komma anzuzeigenden Stellen. Setzen Sie den Wert auf 0, um die Rundung zu deaktivieren.
inserter-throughput-show-toggle=Zeigt eine Schaltfläche in der oberen linken Ecke an, die den Status der Einstellung „Aktiviert“ anzeigt und verwendet werden kann, um diese Einstellung zu ändern, ohne die Mod-Optionen aufzurufen.

[controls]
inserter-throughput-toggle=Anzeige umschalten

[inserter-throughput]
toggle-button-tooltip=Drücken Sie diese Schaltfläche, um die Anzeige des Durchsatzes des Greifarms ein- bzw. auszublenden.
stopwatch-command-description=- Startet eine Stoppuhr, um den Durchsatz eines Greifarms über einen bestimmten Zeitraum zu messen.
stopwatch-help=Führen Sie den Mauszeiger über den Inserter, den Sie messen möchten, wenn Sie diesen Befehl ausführen.
inserter-at=[entity=__1__] bei [gps=__2__,__3__,__4__]
stopwatch-interrupted=Die Messung für __1__ kann nicht abgeschlossen werden, da der Greifarm nicht mehr vorhanden ist.
stopwatch-timeout=Die Messung für __1__ kann nicht abgeschlossen werden, da der Greifarm inaktiv ist.
stopwatch-finished=Messung für __1__ abgeschlossen
stopwatch-result=Gemessener Durchsatz: __1____2__ (__3__ Elemente in __4__ Ticks)
stopwatch-warning-not-max=Warnung! Der Greifarm war nicht voll ausgelastet. Dieses Ergebnis ist nicht repräsentativ für den maximalen Durchsatz des Greifarms.
