[mod-description]
dynamic-hud=Blendet die gesamte Benutzeroberfläche/das HUD (Minikarte, Forschungsfortschritt, Schnellleiste usw.) aus und zeigt dann automatisch nur die relevanten Teile an, je nach den aktuellen Aktionen des Spielers im Spiel.\n\nZeigt die Minikarte an, wenn du fährst, zeigt Waffen an, wenn du kämpfst, zeigt Verknüpfungen an, wenn du deine Kombinatoren neu verdrahtest, und vieles mehr.\ n\nAls Bonus hilft dies dabei, dein OLED vor Einbrennungen zu schützen.

[controls]
dynamic-hud_activate=UI-Ausblendung aktivieren/deaktivieren

[Mod-Einstellungsname]
dynamic-hud_delay=Verzögerung beim Ausblenden (falls zutreffend, in Sekunden)
dynamic-hud_hide-minimap=Minikarte: automatisch ausblenden
dynamic-hud_show-minimap-while-driving=Minikarte: Während der Fahrt anzeigen
dynamic-hud_hide-quickbar=Schnellleiste: Automatisch ausblenden
dynamic-hud_show-quickbar-on-use=Schnellleiste: Bei Verwendung anzeigen
dynamic-hud_show-quickbar-in-combat=Schnellleiste: Im Kampf anzeigen
dynamic-hud_hide-alerts=Warnmeldungen: automatisch ausblenden
dynamic-hud_show-alerts-with-controller-bars=Warnmeldungen: entlang der Controller-Leisten anzeigen
dynamic-hud_hide-top=Mods-Benutzeroberfläche: „oben“ automatisch ausblenden
dynamic-hud_hide-left=Mods-Benutzeroberfläche: „links“ automatisch ausblenden
dynamic-hud_hide-goal=Ziel: automatisch ausblenden (funktioniert nicht)

[mod-setting-description]
dynamic-hud_delay=Eine Zeitverzögerung, die abgewartet wird, bevor ein „nicht benötigtes“ UI-Element ausgeblendet wird. In manchen Fällen werden UI-Elemente sofort ausgeblendet, wenn dies sinnvoller ist. In anderen Fällen, in denen ein UI-Element angezeigt wird, um auf Änderungen hinzuweisen, gibt es dennoch eine sinnvolle Mindestverzögerung, bevor es ausgeblendet wird – selbst wenn die Verzögerungseinstellung auf 0 gesetzt ist.
dynamic-hud_hide-alerts=Diese Mod entscheidet, wann das Warnungsfenster angezeigt wird, indem er alle paar Sekunden prüft, ob sich an den aktiven Warnungen etwas geändert hat. Dieser Ansatz hat zwei Auswirkungen:\n\n1. Wenn eine neue Nicht-Kampf-Warnung ausgelöst wird, erscheint das Warnungsfenster möglicherweise erst nach einer Verzögerung von einigen Sekunden. Bei kampfbezogenen Warnungen zeigt dieser Mod das Warnungsfenster weiterhin sofort an.\n\n2. Die zur Überprüfung verwendete Factorio-API verursacht einen geringen Rechenaufwand, der mit der Anzahl der aktiven Warnungen multipliziert mit der Anzahl der Spieler im Mehrspielermodus zunimmt (man stelle sich Tausende von Entitäten vor, denen in einer vollen Lobby Baumaterialien fehlen). Wenn du dir Sorgen um deine FPS/UPS machst, solltest du diese Einstellung wahrscheinlich deaktivieren (für jeden Spieler im Mehrspielermodus).
dynamic-hud_show-alerts-with-controller-bars=Zu den Controller-Leisten gehören die Symbolleiste, die Schnellleiste und die Tastenkombinationenleiste. Wenn du dich entscheidest, diese Einstellung zu deaktivieren, denke daran, später nicht __REMARK_COLOR_BEGIN__„Warnmeldungen sind ausgeblendet“__REMARK_COLOR_END__ mit __REMARK_COLOR_BEGIN__„Es gibt keine Warnmeldungen“__REMARK_COLOR_END__ zu verwechseln, was auf die Standard-Factorio-Erfahrung zurückzuführen ist.
dynamic-hud_hide-top="Top", auch bekannt als „mod-gui“, ist das Feld oben links mit UI-Elementen, das häufig von Factorio-Mods genutzt wird, um Schaltflächen oder Anzeigen zu platzieren. Denk dabei an __REMARK_COLOR_BEGIN__Helmod__REMARK_COLOR_END__ oder __REMARK_COLOR_BEGIN__Factory Planner__REMARK_COLOR_END__.
dynamic-hud_hide-left="Links" ist der vertikale UI-Bereich am linken Bildschirmrand, der von einigen (?) Factorio-Mods genutzt wird.
dynamic-hud_hide-goal=Seit Version 2.0.76 blendet Factorio das Ziel-Popup nicht mehr aus, wenn dies angefordert wird. Die Option ist für den Fall vorgesehen, dass die API in zukünftigen Factorio-Versionen korrigiert wird.

[tips-and-tricks-item-name]
dynamic-hud_overview=Dynamisches HUD
dynamic-hud_hover-edges=Mauszeiger an Bildschirmrändern schweben lassen
dynamic-hud_triggers=HUD bei Bedarf anzeigen

[tips-and-tricks-item-description]
dynamic-hud_overview=Teile des HUD/der Benutzeroberfläche (Minikarte, Forschungsfortschritt, Schnellleiste usw.) werden nach einer kurzen Verzögerung automatisch ausgeblendet und erst dann wieder angezeigt, wenn sie für deine aktuellen Aktionen relevant sind.\nDas HUD wird vollständig angezeigt, solange das Inventar geöffnet ist. Oder wenn der Cursor die Mitte des oberen Bildschirmrandes berührt. Das automatische Ausblenden kann auch mit __CONTROL__dynamic-hud_activate__ deaktiviert werden.\nSchau dir __REMARK_COLOR_BEGIN__Dynamisches HUD__REMARK_COLOR_END__ unter __REMARK_COLOR_BEGIN__Einstellungen → Mod-Einstellungen → Pro Spieler__REMARK_COLOR_END__ an, um einige der Verhaltensweisen anzupassen. Zum Beispiel die Verzögerung, bevor die Benutzeroberfläche ausgeblendet wird.\n__REMARK_COLOR_BEGIN__WICHTIG:__REMARK_COLOR_END__ Denkt daran, die Benutzeroberfläche in Spielständen mit ausgeblendeter Benutzeroberfläche mit __CONTROL__dynamic-hud_activate__ wieder einzuschalten, BEVOR ihr diese Mod deinstalliert.
dynamic-hud_hover-edges=Wenn Sie den Mauszeiger an einen Bildschirmrand bewegen, werden nahegelegene Teile der Benutzeroberfläche eingeblendet.\nWenn Sie den __REMARK_COLOR_BEGIN__Rand oben rechts__REMARK_COLOR_END__ des Bildschirms berühren, werden der Forschungsfortschritt und das Seitenmenü angezeigt.\ nDurch Berühren des __REMARK_COLOR_BEGIN__rechten__REMARK_COLOR_END__ Bildschirrrandes wird die Minikarte angezeigt.\n__REMARK_COLOR_BEGIN__Unten links__REMARK_COLOR_END__ ist für die Symbolleiste (Waffen und Rüstungen) vorgesehen. __REMARK_COLOR_BEGIN__Unten-Mitte__REMARK_COLOR_END__ ist für die Schnellleiste vorgesehen. __REMARK_COLOR_BEGIN__Unten-rechts__REMARK_COLOR_END__ ist für Schnellzugriffe vorgesehen.\ n__REMARK_COLOR_BEGIN__Der linke__REMARK_COLOR_END__ Bildschirmrand ist für die Oberflächenliste in der Fernansicht vorgesehen.\nDurch Berühren des __REMARK_COLOR_BEGIN__oberen mittleren__REMARK_COLOR_END__ Bildschirmrandes wird die gesamte Benutzeroberfläche vollständig eingeblendet.
dynamic-hud_triggers=Durch bestimmte Aktionen werden relevante Teile der Benutzeroberfläche eingeblendet.\nBeim Einsteigen in ein Fahrzeug wird automatisch die Minikarte eingeblendet.\nWenn die Forschung abgeschlossen ist, wird vorübergehend das Forschungsfortschrittsfenster angezeigt.\nBeim Schießen oder beim Wechseln der Waffen wird angezeigt, welche Waffe du ausgewählt hast und wie viel Munition noch übrig ist.\nDurch Drücken der Hotkeys der Schnellleiste wird die Schnellleiste eingeblendet.\nDas Warnungsfenster wird angezeigt, um über neue Warnungen zu informieren.
