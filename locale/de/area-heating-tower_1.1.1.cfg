[mod-setting-description]
area-heating-tower-max-consumption=Maximale Leistung durch Verbrennung von Brennstoff in einem Turm.
area-heating-tower-heat-consumption=Konstanter Wärmeverbrauch pro Turm zur Beheizung seines Umkreises, unabhängig von der Größe des Gebiets oder der Anzahl der darin befindlichen Gebäude. Muss niedriger sein als der maximale Verbrauch, andernfalls kann sich der Turm nicht aufheizen.
area-heating-tower-specific-heat=Wärmemenge, die benötigt wird, um einen Turm um 1 °C zu erwärmen.
area-heating-tower-heating-update-latency=Höhere Werte können Leistungsspitzen reduzieren, führen jedoch dazu, dass der beheizte Bereich langsamer auf Änderungen der Turmtemperatur reagiert.

