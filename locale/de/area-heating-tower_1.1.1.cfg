[item-description]
area-heating-tower=Beheizt einen Bereich von bis zu 97×97 auf 1000 °C. Die Flächenheizung verbraucht konstant __1__ MW Wärme, unabhängig von der Größe des beheizten Bereichs oder der Anzahl der darin befindlichen Gebäude. Der Wirkungsbereich erweitert sich, wenn sich der Turm aufheizt, und schrumpft, wenn er abkühlt.

[technology-name]
area-heating-tower=Flächenheizturm

[technology-description]
area-heating-tower=Großflächige Beheizung. Schaltet einen Turm frei, der bis zu 97×97 Kacheln bei 1000 °C abdeckt und konstant __1__ MW Wärme verbraucht, unabhängig von der Größe des beheizten Bereichs oder der Anzahl der darin befindlichen Gebäude.

