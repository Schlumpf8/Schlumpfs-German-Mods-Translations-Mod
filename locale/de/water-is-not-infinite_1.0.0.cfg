[mod-setting-description]
water-multiplier=Reduziert oder erhöht die Wassermenge in Gewässern. Ein Wert von 0,5 bedeutet, dass nur halb so viel Wasser verfügbar ist, und ein Wert von 2 bedeutet, dass doppelt so viel Wasser verfügbar ist. Gilt nur für neu generierte Chunks
draw-stepped-contour-bottom=Zeigt auf ausgetrockneten Wasserfeldern einen abgestuften Konturboden anstelle einer ebenen Oberfläche an
rain-refill-rate=Steuert, wie schnell sich Wasserfelder bei Regen wieder füllen (0 – deaktiviert, erfordert die Mod „Dynamic Rain“)
outfall-throughput=Legt den direkten Wasserdurchsatz jedes Abflussrohrs fest. Höhere Werte sorgen dafür, dass sich jeder Abfluss schneller wieder mit Wasser füllt.
infinite-water-enabled=Aktiviert unendliches Wasser für Seen, die größer sind als die angegebene „Grenze für den Wasserbereich der Pumpe“
per-pump-water-tile-limit=Begrenzt die Größe des von einer Pumpe berücksichtigten Wasserbereichs (in Kacheln). Wenn unendliches Wasser aktiviert ist, behandelt die Pumpe den See bei Überschreitung dieser Grenze als unendlich
outfall-cell-soft-cap=Verhindert, dass Abflussrohre die Ziel-Wasserkachel über diesen Wert hinaus überfüllen.
pump-bfs-budget-per-tick=Wie viele Wasserkacheln Pumpen pro Tick insgesamt scannen dürfen, bevor dieses Budget auf die aktiven Pumpen aufgeteilt wird. Höhere Werte lassen Pumpen verbundene Wasserflächen schneller scannen, beanspruchen jedoch mehr CPU-Leistung.
water-equalization-pass-ticks-budget=Wie viele Ticks die Mod für eine vollständige Aktualisierung der aktiven Wasseroberflächen aufwenden soll. Niedrigere Werte lassen das Wasser schneller reagieren, beanspruchen jedoch mehr Leistung.
