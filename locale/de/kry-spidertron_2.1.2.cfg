[item-description]
spidertron-inert-cannon=Dieser Gegenstand kann nicht als Waffe verwendet werden. Er dient ausschließlich dazu, im Spidertron-Rezept verwendet zu werden. Wenn du eine funktionsfähige Handkanone haben möchtest, installiere bitte die Handkanonen-Mod.

