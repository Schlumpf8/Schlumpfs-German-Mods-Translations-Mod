[mod-setting-description]
kry-spidertron-slot1=Standardmäßig Maschinengewehr
kry-spidertron-slot2=Standardmäßig Maschinengewehr
kry-spidertron-slot3=Standardmäßig Raketenwerfer
kry-spidertron-slot4=Standardmäßig Raketenwerfer
kry-spidertron-slot5=Standardmäßig keine
kry-spidertron-slot6=Standardmäßig keine
kry-spidertron-recipe=Aktualisiert das Spidertron-Rezept, um die aktuelle Waffenausrüstung einzubeziehen. Sind einige der Waffen durch eine zusätzliche Technologie gesperrt, werden diese Technologien ebenfalls zur Liste der Voraussetzungen für das Spidertron hinzugefügt.
kry-spidertron-carbon-fiber=Aktualisiert das Spidertron-Rezept so, dass Kohlenstofffasern erforderlich ist, wofür wiederum Gleba-Wissenschaft benötigt wird, wenn "Space Age" aktiviert ist.\nIst diese Option deaktiviert, wird Gleba vollständig aus den Voraussetzungen entfernt, sodass das Spidertron viel früher im Technologiebaum hergestellt werden kann (abhängig von den ausgewählten Waffen)

[spidertron-weapon-name]
spidertron-weapon=Spidertron __1__

[spidertron-description]
spidertron=Ein vielseitiges Fahrzeug, das unwegsames Gelände bewältigen kann. Es ist mit schnell feuernden __1__ ausgestattet, die manuell oder automatisch gesteuert werden können. Kann manuell oder mithilfe der Spidertron-Fernbedienung gesteuert werden.