[tips-and-tricks-item-description]
bpsb-intro-introduction=Willkommen der „Blueprint Sandboxes“-Mod!\nDamit kannst du in laborähnlichen Umgebungen einige Funktionen des Editor-Modus und des Gott-Modus nutzen, ohne dein aktuelles Spiel zu verlassen.\n\nAm besten fügst du Blueprints in deine Sandboxes ein und entnimmst sie wieder, indem du sie kopierst und einfügst sowie deine Blaupausen-Bibliothek nutzt. Manchmal kannst du eine Blaupause auch „mitbringen“, indem du ihn mit dem Cursor auswählst.\n\nUm in deine erste Sandbox zu springen, verwende die Tastenkombination __CONTROL__bpsb-toggle-gui-sb-toggle-shortcut__ oder klicke auf die Umschalt-Schaltfläche in deiner Aktionsleiste. Verwende dieselbe Methode erneut, um die Sandboxen zu verlassen.
bpsb-intro-isolation=Die Einstellung „Isolationsstufe“ bestimmt, wie stark die Sandboxen in Ihr Spiel integriert sind. Jede Einstellung hat wichtige Vor- und Nachteile. Ausführliche Informationen finden Sie auf der Mod-Seite.\n\n„Vollständig“ ist die historische Standardeinstellung und zielt darauf ab, die Sandboxen so weit wie möglich vom Rest des Spiels zu trennen. Dies erfordert Skripte, um einige nützliche Funktionen wieder hinzuzufügen, die durch diesen Ansatz verloren gegangen sind. Der Einsatz von „Fraktion“ und „Controllern“ hat grundlegenden Einfluss darauf, was mit dieser Einstellung möglich ist und was nicht.\n\n„Keine“ ist eine neuere Einstellung, die durch die Fernansicht in Version 2.0 ermöglicht wurde und lediglich darauf abzielt, offensichtliches Cheaten in der Sandbox zu verhindern, das den Rest des Spiels beeinträchtigen könnte.\n\nHier sind die wichtigsten Unterschiede zwischen den beiden Einstellungen:\n\nSicherheit:\n- Vollständig: Verschiedene Gefahren\n- Keine: Völlig sicher\n\nKomplexität:\n- Vollständig: Komplex\n- Keine: Einfach\n\nZugänglichkeit:\n- Vollständig: Einschränkungen\n- Keine: Immer\n\nSichtbarkeit:\n- Vollständig: Persönlich / Zwang\n- Keine: Fraktion\n\nFernansicht:\n- Vollständig: Nicht möglich\n- Keine: Vollständig integriert\n\nTechnologien:\n- Vollständig: Teilweise über Lua synchronisiert\n- Keine: Synchronisiert\n\nForschung:\n- Vollständig: Deaktiviert\n- Keine: Deaktiviert\n\nAll-Tech-Einstellung:\n- Vollständig: Kann verwendet werden\n- Keine: Kann nicht verwendet werden\n\nBenachrichtigungen:\n- Vollständig: Separat\n- Keine: Synchronisiert\n\nChat:\n- Vollständig: Wird über Lua weitergeleitet\n- Keine: Synchronisiert\n\nCharakter:\n- Vollständig: Wird in den Gott-Modus versetzt\n- Keine: Bleibt dein eigener\n\nErfolge:\n- Vollständig: Können ausgelöst werden\n- Keine: Werden ausgelöst\n\nMeilensteine:\n- Vollständig: Getrennt\n- Keine: Synchronisiert\n\nStatistiken:\n- Vollständig: Getrennt\n- Keine: In „Global“ enthalten\n\nLogistik / Zuggruppen:\n- Vollständig: Separat\n- Keine: Synchronisiert\n\nUnendliche Kisten / Lader:\n- Vollständig: Nur in der Sandbox sichtbar\n- Keine: Für alle Mitglieder des Teams sichtbar\n\nRückgängig / Wiederherstellen:\n- Vollständig: Wird beim Betreten/Verlassen zurückgesetzt\n- Keine: Funktioniert wie erwartet
bpsb-intro-multiple-sandboxes=Wenn Sie sich in einer Sandbox befinden, wird eine Sandbox-Benutzeroberfläche angezeigt. Als Erstes werden Sie feststellen, dass Sie die Sandbox wechseln können, in der Sie sich gerade befinden: „Persönlich“: Hierbei handelt es sich um eine Labor-ähnliche Sandbox, die ausschließlich Ihnen zur Verfügung steht. „Fraktion“: Hierbei handelt es sich um eine weitere Labor-ähnliche Sandbox, die von Ihrer gesamten Fraktion gemeinsam genutzt wird. n\nWenn du keine vollständige Isolierung verwendest, kannst du diese Sandboxen auch über die Fernansicht sehen und darauf zugreifen – einschließlich derer deiner Fraktion-Mitglieder.
bpsb-intro-reset-v2=Als Nächstes fällt Ihnen in der Sandbox-Benutzeroberfläche möglicherweise die Schaltfläche „Zurücksetzen“ auf. Mit dieser Schaltfläche können Sie die aktuelle Sandbox, in der Sie sich gerade befinden, vollständig zurücksetzen, falls Sie von vorne beginnen möchten. Nehmen Sie Rücksicht auf andere, wenn Sie diese Funktion in einer Fraktion-weiten Sandbox verwenden!
bpsb-intro-surface-properties=Diese Benutzeroberfläche hilft bei der Konfiguration einer bestimmten Sandbox. So kannst du beispielsweise bestimmte Tageszeiten festlegen oder den Boden unter Strom setzen, um das Aufstellen von Strommasten zu überspringen.\n\nWenn du „Space Age“ oder andere interessante Mods spielst, wirst du vielleicht feststellen, dass einige Entitäten und Rezepte bestimmte Oberflächenbedingungen erfüllen müssen, da sie sonst nicht gebaut oder ausgewählt werden können. Mit dieser Benutzeroberfläche kannst du eine Voreinstellung basierend auf realen Orten auswählen oder diese nach Bedarf anpassen. Hinter den Kulissen können diese Voreinstellungen versteckte, aber wichtige Abweichungen bei den Eigenschaften enthalten, daher solltest du wahrscheinlich die am besten passende Voreinstellung auswählen, bevor du Änderungen vornimmst!
bpsb-intro-sandbox-force=Wenn Sie sich in einer Sandbox-Umgebung im Modus „Vollständige Isolation“ befinden, werden Sie tatsächlich in eine andere Fraktion versetzt, die Ihrer ursprünglichen Fraktion stark ähnelt – diese Information gilt jedoch nicht für den Modus „Keine Isolation“. Da Sie innerhalb von Sandboxen über umfassendere Berechtigungen verfügen, können diese sauber von Ihren normalen Aktivitäten getrennt werden.\n\nDas bedeutet auch, dass Sie nicht mehr „Eigentümer“ aller Objekte in Ihrer realen Welt sind, wie beispielsweise Züge, Bahnsteige oder Geschütztürme. Leider führt dies dazu, dass du keine Benachrichtigungen mehr erhältst, wenn diese beschädigt oder zerstört werden. Bereite dich darauf vor, indem du sicherstellst, dass deine Basis gut verteidigt ist, oder schau häufiger nach, damit dich keine Katastrophe erwartet.\n\nJe nach deinen Mod-Einstellungen synchronisiert diese Fraktion entweder die von dir freigeschalteten Forschung oder alle Forschungen sind bereits freigeschaltet. Im ersten Fall kann der „Fortschritt“ einer einzelnen Technologie nicht in Echtzeit erfolgen, aber die Forschungswarteschlange bleibt synchronisiert.\n\nDa diese Fraktion auf deiner eigene Fraktion basiert, hast du bei einem Fraktionwechsel unterschiedliche fraktionbezogene Sandboxen, und deine persönliche Sandbox muss möglicherweise zurückgesetzt werden (da du darin nichts mehr besitzt).
bpsb-intro-new-recipes-v2=Solange du dich in einer Sandbox-Umgebung befindest, hast du außerdem Zugriff auf einige neue Rezepte und Werkzeuge, die das Experimentieren erleichtern.\n\nZunächst werden die in Factorio selbst versteckten Lader aktiviert, sofern sie nicht bereits durch einen anderen Mod aktiviert wurden. Für dieselben Lasttestzwecke werden auch Unendlich-Akkumulator, -Truhe und -Rohr aktiviert. Du kannst diese als abstrakte Ein- und Ausgänge nutzen, um deine Entwürfe zu testen.\n\nAußerdem steht dir ein Entitäten-Auswahl-Planer zur Verfügung: Mit (__CONTROL__select-for-blueprint__) kannst du diese interessanten Objekte in der Sandbox generieren; mithilfe der alternativen Auswahlmethode (__CONTROL__reverse-select__) kannst du sie wieder entfernen!\ n\nEs gibt einen einfacheren Kachelauswahl-Planer, um die zugrunde liegenden Kacheln zu ändern (oder sie mit __CONTROL__reverse-select__ wieder in Laborkacheln zurückzuverwandeln).\n\nSchließlich kannst du in Sandboxen Gegenstände sofort und direkt am Mauszeiger herstellen; anstatt sie erst in dein Inventar zu legen und dann das Ergebnis auszuwählen, ist alles, was du per Klick herstellst, sofort einsatzbereit! Dies ersetzt auch das, was zuvor an deinem Mauszeiger war, sodass du einfach __CONTROL__open-character-gui__ drücken, auf ein Rezept klicken, __CONTROL__confirm-gui__ drücken, weiter entwerfen, wiederholen und von vorne beginnen kannst. Dies ist zudem benutzerspezifisch konfigurierbar.
bpsb-intro-god-mode=Wenn du eine Sandbox mit „Keine Isolation“ betrittst, betrachtest du die Sandbox in der Fernansicht – und kannst auch darauf zugreifen, indem du in der Fernansicht darauf klickst. Innerhalb dieser Sandboxen werden die meisten Vorgänge, die normalerweise von Bots ausgeführt würden, automatisch (über Lua) abgewickelt, sodass dies in der Regel völlig ausreicht.\n\nWenn du die Sandbox mit „Vollständige Isolation“ betrittst, wirst du wie ein Gott behandelt und hast direktere Kontrolle. Dein Körper bleibt dort, wo du ihn zurückgelassen hast (sei dabei vorsichtig!), und du kannst hier frei schweben. Dieses „Gott“-Inventar ist dauerhaft und vom Inventar deines normalen Spielercharakters getrennt. Dies ist nicht immer möglich, da du dich dafür von deinem Körper trennen musst und sichergestellt werden muss, dass du später wieder sicher mit ihm verbunden werden kannst.
bpsb-intro-auto-building=Zusätzlich zum Gott-Modus stehen dir auch einige Funktionen des Editor-Modus zur Verfügung! Normalerweise würde der Gott-Modus Geister-Entitäten ohne die Gegenstände in deinem Inventar platzieren, aber hier werden die Geister automatisch für dich eingefügt. Auch die Planer für Upgrades und Abriss werden sofort wirksam.\n\nDa hierfür der Editor-Modus nicht verwendet werden kann – und dies daher in Lua erfolgen muss –, ist dies leider langsamer als die „Sofort bauen“-Einstellungen des Editor-Modus.Um mögliche Fehler im Zusammenhang mit der Reihenfolge von Aktionen zu umgehen, gibt es zudem einige Einstellungen, die dieses Verhalten betreffen.\n\nDas Erstellen, Zerstören und Aufrüsten kann jeweils synchron (im selben Tick wie das Ereignis) oder asynchron (in einem periodischen Tick, der nach dem Ereignis geplant ist) erfolgen. Standardmäßig ist in Factorio < 1.1.61 zur Behebung eines Fehlers im Zusammenhang mit der Einstellung „Smart-Belts“ nur das Erstellen auf „asynchron“ gesetzt.\n\nIn den Mod-Einstellungen wird dieses Verhalten aktiviert, wenn der Wert für „Asynchron pro Tick“ auf einen Wert über Null gesetzt wird, wodurch die Anzahl der pro Sandbox individuell verarbeiteten Vorgänge gesteuert wird. Wenn diese Option deaktiviert ist, wird die Anfrage genau dann bearbeitet, wenn das Ereignis ausgelöst wird. Ist diese Option aktiviert, werden die Anfragen zunächst zurückgestellt und stattdessen für die Bearbeitung in einem zukünftigen Tick eingeplant. Die Einstellung steuert dann, wie viele dieser Anfragen pro Iteration bearbeitet werden; natürlich handelt es sich hierbei um eine Leistungseinstellung – ist dir der Durchsatz oder die Latenz wichtiger?\n\nSchließlich wird auch der manuelle Abbau standardmäßig sofort bearbeitet. Dies geschieht durch eine extrem starke Erhöhung der Abbaugeschwindigkeit der Sandbox. Diese Erhöhung ist in den Mod-Einstellungen einstellbar.
bpsb-factorissimo-introduction=Die Kompatibilität mit Factorissimo ist möglich, solange Sie den Fork von notnotmelon verwenden, da dieser einige APIs einführt, die die Integration ermöglichen.\n\nIn den meisten Fällen erhalten Fabriken, die in Sandboxen platziert sind, die zusätzlichen Funktionen, die diese Sandbox bietet. So funktionieren beispielsweise das automatische Geister-Auffüllung und das Schnelles-Crafting innerhalb von Factorissimo-Fabriken. Es gibt jedoch einige Einschränkungen, die unvermeidbar sind.\ n\nDa Fabriken in einer gemeinsamen Oberfläche gespeichert sind, wurden einige oberflächenweite Funktionen in ihnen deaktiviert. Sie können die Helligkeit innerhalb von Fabriken nicht anpassen und sie auch nicht zurücksetzen. Außerdem wäre die „Persistenz“ Ihres unsichtbaren Körpers zu komplex zu handhaben, sodass Sie die Sandbox nicht verlassen oder in eine andere Sandbox wechseln können, wenn Sie sich in einer Fabrik innerhalb dieser befinden – Sie müssen die Fabrik zuerst verlassen.

[messages]
universe-of-sandboxes-intro=Willkommen im Universum der Sandboxen! Jeder Planet besteht aus Laborfliesen, verfügt aber ansonsten über alle seine normalen Eigenschaften.\nVerwende den Editor, um die Landschaft grundlegend zu verändern, falls erforderlich. Beim Verlassen des Editors wechselt das Spiel in den eingeschränkten Gott-Modus.\nWenn du ohne Charakter die Fernansicht nutzt, um eine andere Oberfläche zu betrachten, und diese anschließend verlässt, versetzt dich Factorio auf diese Oberfläche. Nutze diese Funktion, um direkter und ohne Einschränkungen durch die Radarreichweite zu interagieren. Für optimale Ergebnisse solltest du die Isolationsstufe in den Mod-Einstellungen auf „Vollständig“ setzen.
blueprint-in-cursor-from-library=n deinem Mauszeiger befand sich ein Blaupause, doch Factorio stuft ihn fälschlicherweise als ungültig ein. Dies liegt höchstwahrscheinlich daran, dass er sich derzeit in der Blaupausen-Bibliothek befindet (ein bekannter Fehler in Factorio).
character-lost=[img=utility/warning_icon] Leider ist dein vorheriger Charakter vollständig verloren gegangen, sodass du von vorne beginnen musst.
choose-first-associated-character=[img=utility/warning_icon] Du hast mehrere verknüpfte Charaktere, aber die Sandbox weiß nicht genau, welchen du gemeint hast, daher wählt sie den ersten aus, den sie finden kann
god-inventory-almost-full=[img=utility/warning_icon] Dein Inventar ist fast voll. Bitte wirf einige Gegenstände weg.
factorissimo-cannot-change-sandbox=[img=utility/warning_icon] Du befindest dich in einem Fabrikgebäude, daher kannst du die Sandbox nicht wechseln.
cannot-build-in-sandbox=[img=utility/warning_icon] Ein Teil dessen, was du bauen wolltest, kann innerhalb einer Sandbox nicht gebaut werden.
sandbox-force-changed-while-in-sandbox=Deine Fraktion hat sich geändert, daher wurdest du aus einer Sandbox entfernt, in der du dich nicht mehr aufhalten darfst.
sandbox-entrace-from-unsupported-controller=[img=utility/warning_icon] Du hast eine Sandbox auf ungewöhnliche Weise betreten und dabei einen nicht unterstützten Controller verwendet. Du bist nun auf dich allein gestellt.
sandbox-exiting-without-known-entrace=[img=utility/warning_icon] Du bist offenbar nicht auf die erwartete Weise in die Sandbox gelangt, da diese nicht weiß, woher du kommst. Was als Nächstes passiert, könnte unerwartet sein.
sandbox-unsafe-to-close-remote-view=Du verwendest die Fernansicht, die nicht sicher geschlossen werden kann, daher kannst du keine Sandbox betreten. Kehre zuerst zu deinem Charakter zurück.

sandbox-unsafe-to-replace-controller=Dein aktueller Charakter/Controller ist nicht stabil, daher kannst du die Sandbox nicht betreten
sandbox-unsafe-to-replace-controller-watching-a-cutscene=Du siehst dir gerade eine Zwischensequenz an
sandbox-unsafe-to-replace-controller-using-a-jetpack=Du benutzt gerade ein Jetpack
sandbox-unsafe-to-replace-controller-using-the-editor=Du benutzt gerade den Editor
sandbox-unsafe-to-replace-controller-controller-stashed=Der primäre Controller ist verstaut
sandbox-unsafe-to-replace-controller-riding-a-rocket=Fahrt mit einer Rakete
sandbox-unsafe-to-replace-controller-remote-view-while-not-physical=Der physische Controller ist kein physischer Charakter, während die Fernansicht verwendet wird
sandbox-unsafe-to-replace-controller-remote-view-while-driving=Fahren bei Fernansicht
sandbox-unsafe-to-replace-controller-riding-a-platform=Fahrt auf einer Plattform
sandbox-unsafe-to-replace-controller-in-moving-vehicle=in einem fahrenden Fahrzeug