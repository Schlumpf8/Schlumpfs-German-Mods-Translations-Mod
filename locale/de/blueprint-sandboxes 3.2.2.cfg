[mod-setting-description]
bpsb-isolation-level=Wie „isoliert“ die Sandboxen vom Spiel sind, sofern möglich. Eine ausführliche Erklärung findest du unter „Tipps & Tricks“ oder auf der Mod-Seite.
bpsb-allow-all-technology=Gilt nur für „Vollständige Isolation“.
bpsb-only-admins-force-reset=Verhindert im Mehrspielermodus, dass Nicht-Admins Sandboxen, die für die gesamten Bandbreite gelten, zurücksetzen.
bpsb-craft-to-cursor=Beim „Herstellen“ in Sandboxen wird das Ergebnis direkt auf den Cursor gelegt. Gilt nur für „Vollständige Isolation“.
bpsb-extra-mining-speed=Zusätzlicher Multiplikator für die Abbaugeschwindigkeit innerhalb von Sandboxen. Gilt nur für „Vollständige Isolation“.
bpsb-god-async-tick=Wie oft die asynchronen Entitäten verarbeitet werden sollen.
bpsb-god-async-create-per-tick=Bei 0 sofort verarbeiten; bei >0 die Verarbeitung für höchstens diese Anzahl an Entitäten auf einen zukünftigen Tick planen. Weitere Informationen findest du unter „Tipps und Tricks“.
bpsb-god-async-upgrade-per-tick=Bei 0 sofort verarbeiten; bei >0 die Verarbeitung für höchstens diese Anzahl an Entitäten auf einen zukünftigen Tick planen. Weitere Informationen findest du unter „Tipps und Tricks“.
bpsb-god-async-delete-per-tick=Bei 0 sofort verarbeiten; bei >0 die Verarbeitung für höchstens diese Anzahl an Entitäten auf einen zukünftigen Tick planen. Weitere Informationen findest du unter „Tipps und Tricks“.
bpsb-labs-absorb-pollution=Kacheln im Labor absorbieren Verschmutzung wie Gras und helfen so, UPS-Verluste durch zusätzliche Chunks auszugleichen
bpsb-quality-entity-planners=Bei der Auswahl von Entitäten, die in der Sandbox generiert werden sollen, gibt es einen Qualitätsauswähler

[string-mod-setting]
bpsb-isolation-level-none=Keine
bpsb-isolation-level-full=Vollständig

[string-mod-setting-description]
bpsb-isolation-level-none=Auf Sandboxen kann nur aus der Ferne zugegriffen werden, und es besteht die Möglichkeit, dass sich deren Inhalt auf den Rest des Spiels auswirkt. Dies ist möglicherweise nicht ideal für Multiplayer-Speicherstände.
bpsb-isolation-level-full=Die Nutzung der Sandbox erfolgt unter einer anderen Fraktion, was mehrere Vor- und Nachteile mit sich bringt. In erster Linie stehen dir mehr Funktionen zur Verfügung, du hast direkte Kontrolle und kannst Statistiken trennen; allerdings gleicht der Aufenthalt in der Sandbox fast dem Spielen in einem anderen Spiel – mit dem Unterschied, dass auch in diesem Spiel die Zeit vergeht.

