charxpmod_enable_damage_attribs=Aktiviert Rüstungsbonus, Schadensbonus und kritischen Treffer. Deaktivieren Sie diese Option, wenn das Spiel im späten Spielverlauf zu langsam ist.
charxpmod_xpinilevel=Erforderliche XP für den ersten Levelaufstieg
charxpmod_xpmult=Wird verwendet, um die XP-Tabelle von Level 1 bis zur Einstellung „MaxLevel“ unter Verwendung dieses Multiplikators zu erstellen
charxpmod_xp_mp_reductor=Bei jedem Level wird dieser Reduzierer auf den oben genannten Multiplikator angewendet
charxpmod_afk=Maximale Zeit, die ein Spieler AFK (von der Tastatur fern bleibt) bleiben darf (in Minuten), bevor er keine XP mehr erhält. Der Wert Null deaktiviert diese Regel
charxpmod_death_penal=Prozentualer XP-Verlust beim Tod
charxpmod_time_ratio_xp=Einem Spieler wird proportional zu seiner Spielzeit XP gutgeschrieben
charxpmod_print_xp_user=Alle verdienten XP als Chat-Nachrichten ausgeben
