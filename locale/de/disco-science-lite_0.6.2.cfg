[mod-setting-name]
mks-dsl-fallback-overlay-enabled=Automatische Einfärbung für nicht unterstützte Mods
mks-dsl-lab-blinking-disabled=Labor Blinken deaktivieren
mks-dsl-color-pattern-duration=Dauer des Farbmusters (Ticks)
mks-dsl-rainbow-mode=Regenbogen-Farbpalette verwenden
mks-dsl-color-saturation=Farbsättigung (%)
mks-dsl-color-brightness=Farbhelligkeit (%)
mks-dsl-color-update-preset=Animationsqualität
mks-dsl-is-development=Entwicklungsmodus

[mod-setting-description]
mks-dsl-fallback-overlay-enabled=Wenn diese Option aktiviert ist, werden alle von nicht unterstützten Mods hinzugefügten Labore ebenfalls mit einem generischen Leuchteffekt eingefärbt.\nDeaktivieren Sie diese Option, wenn Sie möchten, dass diese Labore ihr ursprüngliches Aussehen behalten.
mks-dsl-lab-blinking-disabled=Wenn diese Option aktiviert ist, wird die Blinkanimation der Standard-Labore in Factorio deaktiviert.\nAktiviere diese Option, wenn du das Blinken als störend empfindest.
mks-dsl-color-pattern-duration=Wie lange jedes Farbmuster angezeigt wird, bevor zum nächsten gewechselt wird, in Spiel-Ticks.\nDas Farbmuster ist am deutlichsten sichtbar, wenn viele Labore gruppiert sind.\n(Standard: 180 Ticks = 3 Sekunden bei 60 UPS)
mks-dsl-rainbow-mode=Wenn diese Option aktiviert ist, werden die Labore unabhängig von den verwendeten Science-Packs in Regenbogenfarben angezeigt.
mks-dsl-color-saturation=Wie kräftig die Farben der Labore erscheinen.\nNiedrigere Werte lassen die Farben eher grau erscheinen.\n(Standard: 100 %)
mks-dsl-color-brightness=Wie hell die Lab-Farben erscheinen.\nNiedrigere Werte lassen die Farben dunkler erscheinen.\n(Standard: 100 %)
mks-dsl-color-update-preset=Legt fest, wie häufig die LAB-Farbanimationen aktualisiert werden.\nDie Aktualisierungshäufigkeit wird automatisch anhand der Anzahl der sichtbaren LAB-Felder angepasst.\n(Standard: Ausgewogen)
mks-dsl-is-development=Gibt an, ob der Entwicklungsmodus aktiviert ist.

[string-mod-setting]
mks-dsl-color-update-preset-smooth=Flüssig
mks-dsl-color-update-preset-balanced=Ausgewogen
mks-dsl-color-update-preset-performance=Leistung

[string-mod-setting-description]
mks-dsl-color-update-preset-smooth=Beste Bildqualität. Häufigere Aktualisierungen, kann jedoch bei UPS mit vielen Labors zu Beeinträchtigungen führen.
mks-dsl-color-update-preset-balanced=Gutes Gleichgewicht zwischen Bildqualität und Leistung. Für die meisten Konfigurationen empfohlen.
mks-dsl-color-update-preset-performance=Priorisiert die UPS. Reduziert die Aktualisierungshäufigkeit bei großen Datenbanken drastisch.