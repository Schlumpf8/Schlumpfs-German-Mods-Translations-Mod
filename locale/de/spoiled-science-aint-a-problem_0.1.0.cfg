[mod-setting-name]
ssaap-whitelisted-packs=Whitelist Wissenschaftspakete
ssaap-blacklisted-packs=Blacklist Wissenschaftspakete
[mod-setting-description]
ssaap-whitelisted-packs=Wird dieses Feld leer gelassen, wird so verfahren, als stünden alle Pakete auf der Whitelist.\nEine durch Kommas getrennte Liste der Pakete, deren Aktualitätsstufe von den Laboren ignoriert wird. Formatierungsbeispiel:\n[font=default-dropdown]agricultural-science-pack, modded-science-pack[/font]
ssaap-blacklisted-packs=Eine durch Kommas getrennte Liste von Packs, bei denen der Frischegrad zwingend den Ertrag beeinflusst. Formatierungsbeispiel:\n[font=default-dropdown]agricultural-science-pack, modded-science-pack[/font]