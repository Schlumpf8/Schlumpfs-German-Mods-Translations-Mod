[technology-description]
promethium-conduit=Schaltet einen mysteriösen Kristall frei, der riesige Energiemengen speichern und abgeben kann.
promethium-fuel=Schaltet einen leistungsstarken Treibstoff frei, der aus den Überresten des zerbrochenen Planeten hergestellt wird.
promethium-heat-pipe=Schaltet ein Rohr frei, das Wärme effizienter überträgt, sowie die Fähigkeit, Beißer-Eier einzufrieren.
promethium-landing-pad=Schaltet einen fortschrittlichen Landeplatz frei, der weitaus größer ist und mehr Landekapseln aufnehmen kann.
promethium-soils=Schaltet robuste Böden frei, die das Wachstum in neuen Umgebungen ermöglichen.
promethium-drill=Schaltet eine massive Bohrmaschine frei, die Wolfram tief unter der Oberfläche von Vulcanus fördern kann. Für den Betrieb ist Kühlmittel erforderlich.


