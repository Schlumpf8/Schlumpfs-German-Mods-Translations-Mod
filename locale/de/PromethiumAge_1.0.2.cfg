[item-description]
promethium-conduit=Ein geheimnisvoller Kristall, der riesige Energiemengen speichern und abgeben kann.
promethium-fuel=Ein leistungsstarker Treibstoff, der aus den Überresten des zerbrochenen Planeten hergestellt wird.
promethium-heat-pipe=Ein Rohr mit effizienterer Wärmeübertragung.
frozen-biter-egg=Ein gefrorenes Biter-Ei.
promethium-drill=Ein massiver Bohrer, der tief in den Kern eines Planeten bohren kann, um Ressourcen zu gewinnen. Er benötigt Kühlmittel für die überhitzte Bohrspitze.
promethium-landing-pad=Ein fortschrittlicher Landeplatz, der viel größer ist und mehr Landekapseln aufnehmen kann.
promethium-jellynut-soil=Verbesserter Boden, der das Wachstum in den angrenzenden Gebieten fördert.
