spidertron-enhancements-volume-scale=Lautstärke für Spidertron-Sounds

spidertron-enhancements-enter-entity=Ein-/Aussteigen aus Fahrzeugen über Spidertron mit __CONTROL__toggle-driving__ oder __CONTROL__spidertron-enhancements-enter-vehicles__
spidertron-enhancements-show-spider-on-vehicle=Spidertron oben am Fahrzeug anzeigen nachdem Einsteigen von einem Spidertron
spidertron-enhancements-enter-player=Spidertron schnell umschalten mit __CONTROL__spidertron-enhancements-enter-vehicles__

spidertron-enhancements-enter-entity-base-game=Ein-/Aussteigen aus Fahrzeugen über Spidertron mit der Standardsteuerung __CONTROL__toggle-driving__
spidertron-enhancements-enter-entity-custom=Ein-/Aussteigen aus Fahrzeugen über Spidertron mit benutzerdefinierter Steuerung __CONTROL__spidertron-enhancements-enter-vehicles__

