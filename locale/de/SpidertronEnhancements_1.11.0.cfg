[gui]
instruction-to-queue-spidertron-order=__1__ um den Bewegungsbefehl in die Warteschlange zu stellen.\n•   __ALT_CONTROL__1__spidertron-enhancements-use-alt-spidertron-remote__, um Spidertron mit Wegfindung zu senden.\n•   __CONTROL__spidertron-enhancements-open-in-map__, um das Spidertron auf der Karte anzuzeigen.\n•   __CONTROL__spidertron-enhancements-open-vehicle-inventory__, um das Inventar des Spidertrons zu öffnen.

[tips-and-tricks-item-name]
spidertron-enhancements=Spidertron-Erweiterungen
spidertron-enhancements-enter-train=Fahrzeuge aus Spidertron betreten
spidertron-enhancements-quick-toggle=Spidertron schnell umschalten
spidertron-enhancements-pathfinder=Spidertron-Fernsteuerung Wegfindung
spidertron-enhancements-remote-pipette=Spidertron-Fernsteuerung Pipette

[tips-and-tricks-item-description]
spidertron-enhancements=Ein Überblick über die wichtigsten Funktionen, die durch [font=default-bold]Spidertron-Erweiterungen[/font] hinzugefügt wurden. Eine vollständige Liste der Funktionen findest du in den Mod-Einstellungen oder auf der Mod-Portalseite.
spidertron-enhancements-enter-train=Drücke __CONTROL__toggle-driving__ und/oder __CONTROL__spidertron-enhancements-enter-vehicles__  (je nach Einstellungen), während du dich in der Nähe eines Fahrzeugs befindest, um einzusteigen.
spidertron-enhancements-quick-toggle=__ALT_CONTROL__1__spidertron-enhancements-enter-vehicles__, um schnell zwischen den von dir gesteuerten Spidertrons und zu Fuß zu wechseln.
spidertron-enhancements-pathfinder=Drücke __ALT_CONTROL__1__spidertron-enhancements-use-alt-spidertron-remote__ mit der [item=spidertron-remote], um den Wegfinder zu nutzen und automatisch um Gewässer herum zu navigieren.
spidertron-enhancements-remote-pipette=__ALT_CONTROL__1__spidertron-enhancements-spidertron-pipette__, während Sie den Mauszeiger über ein Spidertron bewegen, um [item=spidertron-remote] mit diesem Spidertron verbinden.
