[mod-setting-description]
spidertron-enhancements-spiderton-requires-fuel=Standard“ bedeutet, dass der Wert nicht geändert wird, unabhängig davon, wie er in der Standardversion oder durch einen anderen Mod festgelegt ist.
spidertron-enhancements-sound-pause=Durchschnittliche Anzahl von Sekunden, bevor der Sound eines Spidertrons wieder abgespielt wird (der Sound läuft 19 Sekunden lang).

spidertron-enhancements-enter-entity=Konfigurieren Sie die Steuerung auf der Eingestellungs-Registerkarte [font=default-bold]Pro Spieler[/font].

spidertron-enhancements-enter-entity-base-game=Überschreibt das Standardverhalten für __CONTROL__toggle-driving__ wenn man mit einem Spidertron in der Nähe eines Fahrzeugs fährt.\nHängt von der "Ein-/Aussteigen aus Fahrzeugen über Spidertron" [font=default-bold]Karten-[/font]Einstellung ab.
spidertron-enhancements-enter-entity-custom=Hängt von der "Ein-/Aussteigen aus Fahrzeugen über Spidertron" [font=default-bold]Karten-[/font]Einstellung ab.
spidertron-enhancements-pipette-unconnected-remote=Hängt von der „Spidertron-Pipette wählt temporäre Fernbedienung statt aus dem Inventar“ [font=default-bold]Karten-[/font]Einstellung ab.


