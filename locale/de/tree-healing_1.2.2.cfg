[mod-setting-name]
tree-healing-operation-interval=Intervall für Baum-Scan und -Reparatur
tree-healing-chunk-selection-method=Methode zur Auswahl der Baum-Scan-Bereich
tree-healing-chunk-subdivisions=Unterteilungen der Baum-Scan-Bereich
tree-healing-trees-per-heal=Anzahl der pro Vorgang reparierten Bäume
tree-healing-mark-active-chunk=Ausgewählten Bereich auf der Karte markieren

[mod-setting-description]
tree-healing-operation-interval=Zeit (in Ticks) zwischen den einzelnen Überprüfungen eines Teilbereichs auf Bäume bzw. der Reparatur einer Gruppe von Bäumen.\n\nWenn es zu Rucklern kommt und Sie diese mit den anderen Optionen nicht beheben können, sollte eine Erhöhung dieses Werts dazu führen, dass sie seltener auftreten.
tree-healing-chunk-selection-method=Die Methode, nach die Bereiche ausgewählt werden, deren Bäume geheilt werden sollen. „Zufällig“ sollte sich natürlicher anfühlen, während „Sequenziell“ leichter zu überwachen sein sollte.\n\nHat keine Auswirkungen auf die Leistung. Diese Einstellung ist rein eine Frage der persönlichen Vorliebe.
tree-healing-chunk-subdivisions=Die Anzahl der Unterteilungen, in die jeder Bereich beim Scannen nach Bäumen unterteilt werden soll. Diese Zahl gilt pro Seite, sodass die tatsächliche Anzahl des Unterbereichs dem Quadrat dieser Zahl entspricht (2 Unterteilungen = 4 Unterbereiche usw.).\n\nVersuchen Sie, diesen Wert zu erhöhen, wenn es zu Rucklern kommt.
tree-healing-trees-per-heal=Anzahl der Bäume, die pro Durchgang repariert werden.\n\nVersuche, diesen Wert zu verringern, wenn es zu Rucklern kommt.
tree-healing-mark-active-chunk=Legt fest, ob der Bereich, an dem die Mod gerade arbeitet, auf der Karte mit einem Marker gekennzeichnet werden soll. Nützlich zum Debuggen oder einfach, um die Arbeit der Mod zu beobachten.\n\nHat keine Auswirkungen auf die Leistung. Diese Einstellung ist rein eine Frage der persönlichen Vorliebe.

[string-mod-setting]
tree-healing-chunk-selection-method-random=Zufällig
tree-healing-chunk-selection-method-sequential=Sequenziell