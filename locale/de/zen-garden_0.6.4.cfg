[mod-setting-description]
zen-seeds-enabled=Erstellt für jeden Baum einen Samen.
zen-trees-enabled=Eine tragbare Pflanzkastenversion jedes Baumes
force-basic-zen-tree-recipe=Zen-Bäume verwenden einen einfachen Baumsamen\nWird erzwungen, wenn „Zen-Samen“ deaktiviert ist.
bonsai-seed-enabled=Ermöglicht das Pflanzen von schadstoffresistenten Bonsai-Bäumen
zen-bonsai-decor-enabled=Aktiviert die Pflanzkasten-Version von Bonsai-Bäumen
zen-garden-enabled=Aktiviert die Zen- und Oase-Gärten
zen-tower-enabled=Alternativer Landwirtschaftsturm Mk1/Mk2
zen-fountain-enabled=Alternativer Speichertank
move-artificial-tiles=Ziegel und Ähnliches werden in den Reiter „Landschaftsgestaltung“ verschoben.
move-tree-seed=Baumsamen werden in den Reiter „Landschaftsgestaltung“ verschoben.
invasive-forestry=Aktiviert Kunstrasen auf Gleba und ermöglicht das Pflanzen von Baumsamen.
fuel-pollution-overhaul=Holz verursacht als Brennstoff 50 % Umweltverschmutzung, Kohle hingegen 150 %
charcoal-burning-enabled=Ermöglicht das Verbrennen von Holzkisten zu Kohle.
enable-extended-grass-selection=Fügt dem Kunstrasen zusätzliche kosmetische Texturvarianten hinzu
zen-grenade-enabled=Aktiviert die Zen-Granate, die zum Entfernen von Dekorationen vom Typ „Decal“ verwendet wird.