[technology-description]
basic-gardening=Schaltet die Möglichkeit frei, Holz zu Baumsamen zu verarbeiten.
composting=Erzeugt Kompost aus Holz und Unrat.
soil-mixing=Schaltet das Mischen von Erde frei.
charcoal-burning=Verbrenne Holzkisten in einem Schmelzofen, um Kohle zu erhalten.
space-gardening=Schaltet fortgeschrittene Gärtnertechniken für Weltraumumgebungen frei.
gear-gardening=Schaltet das „Garten-Oase“ für effiziente Schadstofffilterung frei.
zen-gardening=Schaltet die Möglichkeit frei, dekorative Zen-Bäume und -Gärten herzustellen. Diese verfügen über passive und aktive Schadstofffilterung.
tree-seeding-selection=Pflanze beliebige Nauvis-Samen deiner Wahl.
zen-agriculture=Universeller großer Landwirtschaftsturm, der Zen-Turm MK2, für effizienten Pflanzenanbau mit großer Reichweite.
zen-bonsai=Schaltet dekorative Bonsais mit aktiver Schadstofffilterung frei.
zen-bonsai-seeding=Zen-Bonsais sind so konzipiert, dass sie schadstoffresistent sind, in geringer Schwerkraft und in einem breiten Druckbereich wachsen können und im Gegenzug für ein langsameres Wachstum einen hohen Ertrag liefern.
zen-maintenance=Zerstört Dekorationen wie Sanddünen und Krater, während die Vegetation intakt bleibt.

