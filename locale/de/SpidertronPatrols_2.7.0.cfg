sp-show-schedule-pane-by-default=Wenn aktiviert, öffnen neu platzierte Spidertrons beim Aufrufen ihre vollständige Zeitplan-Benutzeroberfläche.\n(Das Zeitplan-Fenster jedes Spidertrons kann unabhängig davon mithilfe der Schaltflächen oben rechts in der Spidertron-Benutzeroberfläche einzeln ein- oder ausgeblendet werden).

