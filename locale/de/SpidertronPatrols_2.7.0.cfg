sp-remove-military-requirement=Entfernt Militärwissenschaft [item=military-science-pack] aus [font=default-bold]Spiderling[/font] und [font=default-bold]Spidertron Automation[/font] Technologie.\nEntfernt Raketenwerfer [item=Rakete-Launcher] aus [font=default-bold]Spiderling[/font].\nEmpfohlen bei friedlichen Spielen.
