[tips-and-tricks-item-description]
sp-spidertron-patrols=Ein Überblick über die wichtigsten Funktionen, die durch [font=default-bold]Spidertron Patrols[/font] hinzugefügt wurden.\n\nFalls die Zeitplan-Benutzeroberfläche nicht auf Ihren Bildschirm passt, sollten Sie in den Einstellungen unter „Einstellungen > Benutzeroberfläche“ den [font=default-semibold]UI-Maßstab[/font] verringern oder die Option [font=default-semibold]Flache Charakter-Benutzeroberfläche[/font] deaktivieren.
sp-dock=[entity=sp-spidertron-dock] ermöglicht das automatische Be- und Entladen von Spidertrons mithilfe von Greifarmen. Ein Dock verbindet sich automatisch mit dem ersten Spidertron, das darüber zum Stillstand kommt, und trennt die Verbindung wieder, sobald sich der Spidertron entfernt.
sp-spidertron-automation=Rufen Sie [item=sp-spidertron-patrol-remote] über das Bedienfeld auf der rechten Seite der Spidertron-Benutzeroberfläche auf oder drücken Sie __CONTROL__spidertron-enhancements-spidertron-patrol-pipette__ , während Sie den Spidertron ausgewählt haben.\nDie blinkende Zahl zeigt an, welcher Wegpunkt derzeit ausgewählt ist. Mit __ALT_CONTROL__2__use-item__ wird ein neuer Wegpunkt nach dem aktuell ausgewählten erstellt. Mit __ALT_CONTROL__2__sp-replace-previous-waypoint__ wird der aktuell ausgewählte Wegpunkt an die angegebene Position verschoben.\nUm einen Wegpunkt zum Einfügen oder Ersetzen auszuwählen, klicken Sie auf die Schaltfläche [img=item.sp-spidertron-patrol-remote] in der Zeile dieses Wegpunkts in der Zeitplan-Benutzeroberfläche.\n\n__ALT_CONTROL__1__sp-delete-all-waypoints__ um alle Wegpunkte zu löschen.\n__ALT_CONTROL__1__sp-toggle-spidertron-automatic-manual__ um den automatischen/manuellen Modus für das aktuell ausgewählte, geöffnete, mit einer ferngesteuerten Einheit verbundene oder gesteuerte Spidertron umzuschalten.
sp-wait-conditions=Wartebedingungen können für jeden Wegpunkt über die Zeitplan-Benutzeroberfläche festgelegt werden. Sie verhalten sich ähnlich wie Wartebedingungen für Züge, allerdings kann jeder Wegpunkt nur eine Wartebedingung haben. Wenn Sie mehrere Wartebedingungen an einem Wegpunkt kombinieren müssen, können Sie oft ein ähnliches Ergebnis erzielen, indem Sie mehrere Wegpunkte an derselben Position festlegen, jeweils mit einer anderen Wartebedingung. Ist dies nicht möglich, verwenden Sie eine [font=default-semibold]Schaltkreisbedingung[/font] als Wartebedingung und fügen Sie Kombinatoren ein [entity=sp-spidertron-dock] an dieser Position an.
sp-automatic-refueling=Wenn ein Fahrzeug Kraftstoff benötigt, verwenden Sie die Wartebedingung [font=default-semibold]Voller Tank[/font], um zu verhindern, dass das Fahrzeug einen Wegpunkt verlässt, bevor es vollständig betankt wurde. Es gibt zwei Methoden zur automatischen Betankung:\n\n - Konfigurieren Sie ein [entity=sp-spidertron-dock], um eine Verbindung zum „Brennstoff“-Inventar des Fahrzeugs herzustellen, und laden Sie dann Brennstoff mithilfe von Einfüllvorrichtungen ein.\n- Fügen Sie direkt am Fahrzeug eine Logistikanforderung für Brennstoff hinzu, der von [entity=logistic-robot] geliefert wird. Der gelieferte Brennstoff wird direkt in das Brennstoffinventar des Fahrzeugs eingefüllt.
sp-aircraft-automation=Flugzeuge von [font=default-bold]Lex's Aircraft[/font] können ebenfalls mithilfe von [item=sp-spidertron-patrol-remote] und [entity=sp-spidertron-dock] automatisiert werden.
sp-submarine-automation=U-Boote von [font=default-bold]Maraxsis[/font] können auch mit [item=sp-spidertron-patrol-remote] und [entity=sp-spidertron-dock] automatisiert werden.\nVerwende die [font=default-semibold]Untertauchen[/font] Wartebedingung an einem Wegpunkt über einen Tiefseegraben, um den Graben zu betreten oder zu verlassen.
