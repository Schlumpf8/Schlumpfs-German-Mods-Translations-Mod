[mod-setting-name]
biter-cleanup-operation-interval=Operationsintervall
biter-cleanup-captive-spawners-produce-creep=Gefangene Beißernester erzeugen Creep
biter-cleanup-cleanup-speed=Bereinigungsgeschwindigkeit
biter-cleanup-compensate-for-map-size=Anpassung an die Kartengröße
biter-cleanup-nominal-map-size=Nominale Kartengröße
biter-cleanup-primary-decal-check-range=Creep-Radius um Nester
biter-cleanup-secondary-decal-removal-range=Bereinigungsbereich für Creep-Schäden
biter-cleanup-mark-cleanups-with-map-pins=Bereinigungsorte mit Kartenmarkierungen kennzeichnen

[mod-setting-description]
biter-cleanup-operation-interval=ie oft die Mod tatsächlich Aufgaben ausführt (gemessen in Ticks). Die auf Tick-Basis berechneten Raten werden von dieser Einstellung nicht beeinflusst, sie werden lediglich in Stapel dieser Tick-Anzahl zusammengefasst.\ n\nDiese Einstellung stellt einen Kompromiss dar zwischen einer höheren, aber gleichmäßigeren durchschnittlichen Leistungsbeeinträchtigung (bei niedrigeren Werten) und einer insgesamt geringeren Beeinträchtigung, jedoch mit gelegentlichen Spitzen, die zu spürbaren Rucklern führen können (bei höheren Werten). Passen Sie die Einstellung nach Ihren Vorlieben an. Wenn Sie Ruckler feststellen, die sich durch Anpassen der anderen Einstellungen nicht beheben lassen, führt eine deutliche Erhöhung dieser Einstellung dazu, dass diese seltener auftreten (maximal einmal pro Stunde).
biter-cleanup-captive-spawners-produce-creep=Ob ein Gefangenes Beißernest aus „Space Age“ als Neststrukturen gewertet werden, um zu prüfen, ob „Biter Creep“ entfernt werden sollte.\n\nHat keine Auswirkungen auf die Leistung. Diese Einstellung ist rein optional.\n\nHat keine Auswirkung (gilt als deaktiviert), wenn „Space Age“ nicht installiert und aktiviert ist.
biter-cleanup-cleanup-speed=Die durchschnittliche Anzahl der pro Tick durchzuführenden Bereinigungsvorgänge.\n\nDiese Einstellung hat erhebliche Auswirkungen auf die Leistung. Sie sollte unter fast allen Umständen sehr niedrig eingestellt sein. Seien Sie vorsichtig, wenn Sie diesen Wert erhöhen, da dies wahrscheinlich erhebliche Auswirkungen hat. Sollten Sie unerwartete Verlangsamungen oder Ruckler feststellen, versuchen Sie, diesen Wert zu verringern.
biter-cleanup-compensate-for-map-size=Legt fest, ob die Mod mit zunehmender Größe der Karte mehr Bereinigungsarbeiten durchführen soll, um die scheinbare Abklingrate des Creeps während eines Durchspiels einigermaßen konstant zu halten.\n\nDie Auswirkungen dieser Einstellung auf die Leistung hängen von der Größe deiner Speicherdatei im Vergleich zur Einstellung „Nominale Kartengröße“ ab. Weitere Details findest du in der Beschreibung dieser Einstellung.
biter-cleanup-nominal-map-size=Wenn „Anpassung an die Kartengröße“ aktiviert ist, legt diese Einstellung die Größe der Karte (gemessen in Chunks) fest, bei der die Bereinigungsrate genau der entspricht, die Sie mit der Einstellung „Bereinigungsgeschwindigkeit“ festgelegt haben. Das Verhältnis zwischen der aktuellen Größe Ihres Speicherstands und dem Wert dieser Einstellung bestimmt die Bereinigungsrate. Die Hälfte der angegebenen Größe bedeutet die Hälfte der angegebenen Bereinigungsgeschwindigkeit. Aber Vorsicht, das Gegenteil trifft ebenfalls zu – doppelte Größe bedeutet doppelte Bereinigungsgeschwindigkeit und folglich doppelte Auswirkungen auf die Leistung!\n\nAufgrund der variablen Auswirkungen dieser Einstellung sollten Sie versuchen, sie auf etwa die Größe Ihrer größten Speicherstände einzustellen, damit die Geschwindigkeit und die Auswirkungen tendenziell reduziert werden. Diese Größe können Sie mit dem Befehl „biter-cleanup-map-size“ ermitteln. Sie können diese Einstellung auch erhöhen, um die Auswirkungen auf die Leistung zu verringern, oder verringern, um die Bereinigungsgeschwindigkeit zu erhöhen.\n\nHat keinerlei Auswirkungen, wenn „Kartengröße ausgleichen“ deaktiviert ist.
biter-cleanup-primary-decal-check-range=Jedes Creep, das weiter als diese Entfernung (in Kacheln) vom Nest entfernt ist, wird entfernt.\n\nDiese Option hat hauptsächlich kosmetischen Charakter. Eine Verringerung dieses Werts kann eventuelle Ruckler verringern, wird aber höchstwahrscheinlich keinen nennenswerten Unterschied bewirken.
biter-cleanup-secondary-decal-removal-range=„Biter Creep“ färbt nicht nur den Boden ein, sondern schädigt auch die Vegetation und andere Umweltelemente – allerdings können diese Schäden auch auf natürliche Weise entstehen, beispielsweise wenn Pflanzen in Wüsten weniger gesund sind. Diese Einstellung legt den Abstand (in Kacheln) um einen „Creep“-Bereich fest, in dem diese Schäden ebenfalls beseitigt werden.\n\nDiese Option hat hauptsächlich kosmetischen Charakter. Eine Verringerung des Wertes kann eventuelle Ruckler verringern, wird aber höchstwahrscheinlich keinen nennenswerten Unterschied bewirken.
biter-cleanup-mark-cleanups-with-map-pins=Ob die Standorte laufender Reinigungsmaßnahmen auf der Karte mit Markierungen gekennzeichnet werden sollen.\n\nHat keine Auswirkungen auf die Leistung. Diese Einstellung ist rein optional.

[biter-cleanup-command-help]
map-size=Gibt die Anzahl der Chunks im aktuellen Spielstand aus, sowohl als Gesamtsumme als auch als individuelle Anzahl für jede Oberfläche.
cleanup-speed=Gibt Informationen zur aktuellen Geschwindigkeit der Bereinigungsvorgänge aus.
recount-chunks=Zwingt die Beißer-Bereinigung dazu, die Anzahl der Chunks im gesamten Spielstand und auf jeder Oberfläche neu zu berechnen, und zeigt etwaige Abweichungen zwischen den erfassten und den tatsächlichen Werten an.
clean-here=Erzwingt die Durchführung eines Bereinigungsvorgangs am aktuellen Standort des Spielers.
clean-everywhere=Führt eine Bereinigung aller Oberflächen im gesamten Spielstand durch. Das Spiel friert dabei wahrscheinlich für eine Weile ein.

[biter-cleanup-command-output]
# Map Size command
map-size-total-chunk-count=[Biter Cleanup] Die Gesamtzahl der Chunks im aktuellen Speicherstand beträgt __1__. Diese setzt sich wie folgt zusammen:
map-size-surface-chunk-count=[Biter Cleanup] __1__ __plural_for_parameter__1__{1=chunk|rest=chunks}__ on __2__ [__3__]
# Cleanup Speed command
cleanup-speed-operation-rate-lt-eq-tick=[Biter Cleanup] Ein Bereinigungsvorgang wird ungefähr einmal pro __plural_for_parameter__1__{1=tick|rest=__1__ ticks}__ durchgeführt
cleanup-speed-operation-rate-gt-tick=[Biter Cleanup] Pro Tick werden ungefähr __1__ Bereinigungen __plural_for_parameter__1__{1=operation is|rest=operations are}__ durchgeführt.
# Refresh Chunk Count command
recount-chunks-total-chunk-count-changed=[Biter Cleanup] Es gab eine Abweichung von __1____2__ bei der Gesamtanzahl der Chunks (war __3__, ist jetzt __4__). Dies setzt sich wie folgt zusammen:
recount-chunks-total-chunk-count-cancelled-out=[Biter Cleanup] Es wurden Unstimmigkeiten bei der Anzahl der Chunks pro Oberfläche festgestellt, die Gesamtsumme war jedoch weiterhin korrekt. Die Fehler pro Oberfläche waren:
recount-chunks-surface-chunk-count-changed=[Biter Cleanup] __1____2__ __plural_for_parameter__2__{1=chunk|rest=chunks}__ on __3__ [__4__] (war __5__, ist jetzt __6__)
recount-chunks-no-changes=[Biter Cleanup] Chunk-Anzahlen aktualisiert. Keine Unstimmigkeiten festgestellt.
# Clean Here command
clean-here-start=[Biter Cleanup] Bereinigungsvorgang gestartet.
# Clean Everywhere command
clean-everywhere-warning=[Biter Cleanup] Die Bereinigung des gesamten Spielstands auf einmal führt wahrscheinlich dazu, dass Ihr Spiel für einige Zeit einfriert, insbesondere bei großen Spielständen oder auf leistungsschwächerer Hardware. Keine Sorge, das ist normal.
clean-everywhere-end=[Biter Cleanup] Bereinigung abgeschlossen.