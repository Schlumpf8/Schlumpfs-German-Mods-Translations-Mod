[mod-setting-description]
debug-refining-graph=Bei Aktivierung wird der Denkprozess bei der Berechnung der Veredelungszeit in die Datei „factorio-current.log“ ausgegeben – dies dient ausschließlich dazu, zu überprüfen, warum ein bestimmter (modifizierter) Gegenstand nicht veredelbar ist
promethium-chunk-spoil-time=Wenn aktiviert und der Wert größer als 0 Stunden ist, verfallen Promethium-Asteroidenbrocken zu "Sauerstoffhaltigen Astroidenbrocken"
refining-hardness=Globaler Multiplikator für die wahrgenommene „Komplexität“ von Gegenständen, der später durch „Veredelungsgrad“ beeinflusst wird. Ein höherer Wert bedeutet mehr Veredelungszeit.
refining-lean=Ein höherer Wert begünstigt komplexe Gegenstände stärker, wodurch ihre Veredelungszeit kürzer ausfällt, als sie eigentlich sein sollte.
refining-time-multiplier=Globaler Multiplikator für die Veredelungszeit. Wird von „Grad“ nicht beeinflusst. Ein höherer Wert bedeutet eine längere Veredelungszeit.
refining-time-max=Setzt eine feste Obergrenze für die Veredelungszeit aller Gegenstände. Auf 0 setzen, um die Funktion zu deaktivieren.
refining-default-science-pack-time=Alle Wissenschaftspakete haben eine fest programmierte Veredelungszeit. Dies legt die Standard-Veredelungszeit für Mod-Wissenschaftspakete fest, die nicht bereits durch die Mod selbst festgelegt wurden.
refinery-allow-quality=Nicht empfohlen, da die Prämisse des kostenlosen Upcyclings ohnehin schon übermächtig ist.

