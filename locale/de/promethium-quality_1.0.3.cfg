[Technologie-Beschreibung]
Raffinerie=Du erkennst, dass Röntgenstrahlen, die auf dem Zerfall von Promethium basieren, dazu genutzt werden können, feine Mängel in Zutaten und Maschinen aufzudecken. Der nächste naheliegende Schritt ist, einen Weg zu finden, deren Veredelung zu automatisieren...
