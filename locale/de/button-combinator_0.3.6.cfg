[entity-description]
gofarovich-bc-pulse=Sendet beim Klicken für eine festgelegte Anzahl von Ticks ein Schaltungssignal. Drehen Sie den Schalter (R), um auf die Einstellungen auf der Anschlussseite zuzugreifen; drehen Sie ihn zurück, um die Taste zu verwenden.
gofarovich-bc-switch=Ein Zweistellungsschalter für den Schaltkreise. Drehen (R), um auf die Einstellungen auf der Anschlussseite zuzugreifen; zurückdrehen, um die Schaltfläche zu verwenden.

[item-name]
gofarovich-bc-pulse=Taster-Kombinator
gofarovich-bc-switch=Schalter-Kombinator

[item-description]
gofarovich-bc-pulse=Sendet beim Klicken ein Signal für eine festgelegte Anzahl von Ticks. Drehen, um auf die Einstellungen zuzugreifen.
gofarovich-bc-switch=Ein Zweistellungsschalter für den Schaltkreise. Drehen, um auf die Einstellungen zuzugreifen.

[gofarovich-bc-gui]
back-signal=Rückmeldung
back-signal-tt=Lassen Sie den Schaltkreis die Schaltfläche steuern.\n„Ein, wenn“ schaltet sie ein, „Aus, wenn“ schaltet sie aus. Solange eine Bedingung erfüllt ist, sind manuelle Klicks deaktiviert. Wenn beide gleichzeitig ausgelöst werden, friert der Zustand einfach so ein, wie er ist.
enable-cond=Ein, wenn
disable-cond=Aus, wenn
operand-toggle-tt=Den rechten Argument zwischen einer Konstante und einem Signal umschalten
pick-signal=Signal auswählen
pick-none=Löschen (kein Signal)
or-const=Oder eine Konstante festlegen
set-const=Konstante festlegen
add-description=Beschreibung hinzufügen
edit-description=Beschreibung bearbeiten
save-description=Beschreibung speichern
insert-icon=Symbol einfügen:
insert-icon-tt=Ein Signal auswählen, um dessen Symbol in den Text einzufügen
description=Beschreibung
active-signal=Aktives Signal
inactive-signal=Ruhe Signal
duration=Taster-Dauer (Ticks)
duration-tt=Ein Klick löst das aktive Signal für diese Anzahl an Ticks aus, anschließend läuft der Timer ab und das Signal wird automatisch deaktiviert.\n1 = ein Impuls mit einem Tick. 60 Ticks = 1 Sekunde. Durch erneutes Klicken wird der Timer neu gestartet.
