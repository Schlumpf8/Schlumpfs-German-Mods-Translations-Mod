[mod-name]
light-overhaul=Light Overhaul

[mod-description]
light-overhaul=Ändert die Beleuchtungseinstellungen des Spiels mithilfe von LUTs. Die Nächte wirken dunkler, weisen jedoch einen höheren Kontrast auf. Der Charakter verfügt über einen breiteren Taschenlampenstrahl. Die Nachtsicht entsättigt nicht alles. Eine eigenständige Version der Beleuchtungsänderungen von AAI Industry.

[mod-setting-name]
wide-flashlight=Breiter Taschenlampenstrahl
enhanced-nightvision=Verbesserte Nachtsicht
night-lut-set=Nacht-LUT-Set

[mod-setting-description]
wide-flashlight=Ersetzt die Taschenlampe des Charakters durch eine Version mit breiterem Lichtkegel.
enhanced-nightvision=Verwendet eine Nachtsicht-LUT, die den Bildschirm nicht entsättigt, sondern einigen Schatten einen leichten grünen Schimmer verleiht.
night-lut-set=Die Stärke des Nachtein-Dunkelheitseffekts.

[string-mod-setting]
Dark=Dunkel
Bright=Hell
Vanilla=Standard