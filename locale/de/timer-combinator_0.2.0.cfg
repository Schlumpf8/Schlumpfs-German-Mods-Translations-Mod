runtime-error=Timer gestoppt: __1__
paste-rejected=Die Timer-Einstellungen konnten nicht kopiert werden. Die Zieleinstellungen und die Ausgabe wurden wiederhergestellt.
import-rejected=Die importierten Einstellungen sind nicht verfügbar oder werden nicht unterstützt. Der Timer wurde angehalten. Überprüfen Sie alle Einstellungen und wählen Sie „Übernehmen und Reset“, um sie zu übernehmen. Mit „RESET“ allein können die neuen Einstellungen nicht übernommen werden.
rigger-tooltip=Startet, wenn sich die Bedingung von „falsch“ auf „wahr“ ändert. Eine dauerhaft wahre Bedingung führt nicht zu einem Neustart des Timers. Änderungen während der Ausführung werden ignoriert. Jede Funktion verwendet unabhängige Takte mit gemeinsamer Zeitmessung und Zählstand.
reset-tooltip=Ein globaler RESET stoppt alle Uhren und löscht alle Ausgänge sowie den Zählstand der abgeschlossenen Vorgänge. RESET hat Priorität. Die einzelnen Takte sind keine RESET-Operanden. Nach einem RESET müssen „hoch“-Identitäten auf „falsch“ gesetzt oder entfernt werden, bevor eine erneute Aktivierung erfolgen kann.
trigger-anything-tooltip=__1__: Ein Takt startet, sobald ein beliebiges empfangenes Signal übereinstimmt. Ein leerer Eingang gilt als „falsch“. Eine Übergabe, während die Bedingung "wahr" bleibt, löst keinen erneuten Trigger aus.
trigger-everything-tooltip=__1__: Ein Takt beginnt, wenn alle empfangenen Signale übereinstimmen. Ein leerer Eingang gilt als „wahr“; hierfür ist keine Ressourcenliste erforderlich.
trigger-each-tooltip=__1__: Unabhängige Takte für jeden Signaltyp, jeden Namen und jede Qualität. Timing und Ausgangszahl werden gemeinsam genutzt. Aktive Takte und abgeschlossene Zyklusbudgets bleiben bis zu einem globalen RESET oder „Anwenden“ erhalten.
reset-anything-tooltip=__1__: Ein globaler RESET löscht jeden Takt und jeden Ausgang, sobald ein beliebiges empfangenes Signal übereinstimmt. Ein leerer Eingang ist „falsch“.
reset-everything-tooltip=__1__: Ein globaler RESET löscht jeden Takt und jeden Ausgang, sobald alle empfangenen Signale übereinstimmen. Ein leerer Eingang ist „wahr“.
reset-each-tooltip=__1__ ist für den globalen RESET nicht gültig. Wählen Sie ein explizites Signal, "Irgendetwas" oder "Alles".
output-anything-tooltip=__1__ ist kein explizites Ausgangssignal. Wählen Sie ein explizites Signal aus; automatisch: Jeder Ausgang folgt jedem Start.
output-everything-tooltip=__1__ ist kein explizites Ausgangssignal. Wählen Sie ein explizites Signal aus; automatisch: Jeder Ausgang folgt jedem Start.
output-each-tooltip=__1__ Die Ausgabe erfolgt nur bei jedem Start automatisch. Andernfalls wählen Sie ein explizites Ausgangssignal.
output-each-automatic-tooltip=__1__: Automatische Anpassung von Eingangsidentitäten und -qualitäten. Die Anzahl der gemeinsamen Ausgänge bleibt bearbeitbar. Ihr expliziter Ausgabevorschlag wird für eine spätere Rückumstellung beibehalten.
each-baseline=Each: Warten auf RESET-Basislinie
each-active=Each: __1__ aktive Takte
each-completed=Ausgangstakte: __1__ · Beendet: __2__
each-status-tooltip=Aktive Takte laufen herunter, pulsieren oder werden gehalten. Die Budgets für beendete Zyklen bleiben bis zu einem globalen RESET oder „Anwenden“ erhalten. Es gibt keine gemeinsame Frist für die einzelnen Takte.
threshold=Vergleichen Sie die Signalanzahl mit dieser Ganzzahl.
network-tooltip=Lesen Sie die ausgewählten Eingangsleitungen aus. Wenn Sie beide auswählen, werden ihre Signalanzahlen addiert.
delay-tooltip=Wartezeit vor dem Senden des Ausgangssignals. Bei Wiederholung wird diese gesamte Verzögerungszeit nach jedem Impulsende abgewartet.
width-tooltip=Wie lange das Ausgangssignal anliegt. Langsame Empfänger könnten kurze Impulse übersehen. Eine Sekunde entspricht 60 Ticks.
cycles-tooltip=Gesamtzahl der abgeschlossenen Zyklen seit dem Reset. Bei Erreichen des Limits stoppt der Timer bis zum nächsten Reset.
cycles-hint=Zyklen (0 = unbegrenzt)
triggered-hint=Jeder neue Trigger startet einen Countdown, bis zum Zykluslimit.
repeat-hint=Ein Trigger startet die Sequenz. Jeder Impuls endet, bevor die nächste Wartezeit beginnt.
output-tooltip=Wird auf beiden angeschlossenen Ausgangsleitungsfarben gesendet. Jede verwendet passende Eingangsidentitäten mit dieser gemeinsamen konstanten Zählung; Eingangswerte werden nicht weitergeleitet.
apply-tooltip=Speichert diese Einstellungen und bricht den aktuellen Durchlauf ab. Die Startbedingung muss auf „falsch“ gesetzt werden, bevor ein Neustart erfolgen kann.
stale=Konfiguration wurde an anderer Stelle geändert. Schließen Sie dieses Fenster und öffnen Sie es erneut, bevor Sie die Änderungen übernehmen.
applied=Einstellungen wurden übernommen. Senken Sie den Trigger, bevor Sie starten.
invalid-config=Ungültige Konfiguration.
invalid-signal=Wählen Sie ein vorhandenes Signal, einen Vergleich und einen für diese Bedingung gültigen ganzzahligen Schwellenwert aus.
invalid-reset-each=RESET ist global. Wählen Sie ein explizites Signal, "Irgendetwas" oder "Alles" aus; "Jedes" ist nicht zulässig.
invalid-output-signal=Wählen Sie ein explizites Ausgangssignal aus. Jeder Ausgang wird nur bei „Jeder Start“ automatisch geschaltet.
invalid-condition-count=Geben Sie eine ganze Zahl zwischen -2.147.483.648 und 2.147.483.647 ein.
invalid-time=Dauern müssen ganze Ticks zwischen 1 und 5.184.000 (24 Simulationsstunden) sein.
invalid-delay_ticks=Die Verzögerung muss 1 bis 5.184.000 ganze Ticks betragen. Eine Sekunde entspricht 60 Ticks.
invalid-pulse_ticks=Die Impulsdauer muss zwischen 1 und 5.184.000 ganzen Ticks liegen. Eine Sekunde entspricht 60 Ticks.
invalid-cycles=„Stop nach“ muss eine ganze Zahl zwischen 0 und 2.147.483.647 sein. 0, wenn keine Begrenzung gewünscht ist.
invalid-output_count=Der Ausgabewert muss eine ganze Zahl zwischen -2.147.483.648 und 2.147.483.647 sein, nicht 0.
invalid-count=Die Zyklusgrenze muss zwischen 0 und 2.147.483.647 liegen. Die Ausgabe muss eine ganze, ausgestellte 32-Bit-Zahl sein, nicht 0.
invalid-mode=Wählen Sie einen unterstützten Betriebsmodus und ein Ausgabeverhalten aus.
hold-single-only=Für „Halten“ sind der Modus „Pro Trigger“ und „Stop nach“ = 1 erforderlich. Die Ausgabe bleibt bis zum Reset aktiv.
write-failed=Die native Ausgabe konnte nicht aktualisiert werden. Der Timer wurde angehalten; versuchen Sie einen RESET.