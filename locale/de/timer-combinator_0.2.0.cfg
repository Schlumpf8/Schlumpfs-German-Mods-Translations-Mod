[entity-name]
timer-combinator=Zeit-Kombinator

[entity-description]
timer-combinator=Verzögert und wiederholt Schaltimpulse. Kann zur Konfiguration von Trigger, RESET, Dauer und Zyklusbegrenzung geöffnet werden. Benötigt Strom; pausiert bei unzureichender Stromversorgung und setzt den Betrieb fort, sobald die Stromversorgung wiederhergestellt ist.

