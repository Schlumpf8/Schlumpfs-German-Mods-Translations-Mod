[mod-name]
inventory-repair=Inventar-Reparatur

[mod-setting-name]
inventory-repair-interval=Reparaturintervall
inventory-repair-order=Reihenfolge der Werkzeugauswahl

[mod-setting-description]
inventory-repair-interval=Wie oft Reparaturen durchgeführt werden sollen, in Ticks. Die pro Intervall reparierte Menge wird so angepasst, dass die Gesamtrate unverändert bleibt. Kleinere Werte können die Leistung beeinträchtigen.\n\n[color=blue]Standard:[/color] __1__\n[color=blue]Minimum:[/color] __2__
inventory-repair-order=Ob das schnellste oder das langsamste Reparaturpaket ausgewählt werden soll. Werkzeuge mit unbegrenzter Haltbarkeit und der höchsten Geschwindigkeit werden unabhängig von der Einstellung immer zuerst ausgewählt.

[string-mod-setting]
inventory-repair-order-ignore=Nur Normal
inventory-repair-order-low-first=Günstigstes zuerst
inventory-repair-order-high-first=Schnellstes zuerst