[enemy-alert]
unit-group-gather=Feinde versammeln sich
unit-group-attack=__1__ __plural_for_parameter__1__{1=Feind|rest=Feinde}__ greifen an
unit-group-expand=__1__ __plural_for_parameter__1__{1=Feind|rest=Feinde}__ breiten sich aus
unit-group-expand-arrive=Feinde errichten eine neue Basis
spawners-consuming-pollution=Nest absorbiert Umweltverschmutzung (__1__ __plural_for_parameter__1__{1=Nest|rest=Nester}__)
spawners-consuming-pollution-toggle=Warnung zur Schadstoffaufnahme ist __1__
spawners-consuming-pollution-toggle-enabled=aktiviert
spawners-consuming-pollution-toggle-disabled=deaktiviert

[mod-setting-name]
enemy-alert-pollution=Warnung, wenn Nester Umweltverschmutzung absorbieren
enemy-alert-gathering=Warnung, wenn Feinde beginnen, sich zu einer Gruppe zusammenzuschließen
enemy-alert-attack=Warnung, wenn Feinde beschließen, ein Gebiet anzugreifen
enemy-alert-minimum-attack-group-size=Mindestgröße der Angriffsgruppe
enemy-alert-expand=Warnung, wenn Feinde beschließen, in ein Gebiet vorzudringen
enemy-alert-expand-arrive=Warnung, wenn Feinde im Expansionsgebiet eintreffen
enemy-alert-notification-sound=Benachrichtigungston
enemy-alert-other-surfaces=Warnung bei Aktivität auf anderen Oberflächen
enemy-alert-charted-areas-only=Warnung nur bei Aktivität in kartierten Gebieten

[mod-setting-description]
enemy-alert-minimum-attack-group-size=Zeige eine Angriffswarnung nur an, wenn die Gruppe mindestens diese Anzahl an Mitgliedern hat. Warnungen zu Sammel- und Expansionsaktivitäten sind davon nicht betroffen
enemy-alert-expand-arrive=Wird ausgelöst, wenn eine feindliche Gruppe am Expansionsort eintrifft und mit dem Bau einer neuen Basis beginnt
enemy-alert-other-surfaces=Erhalte Warnungen von anderen Planeten, Weltraumplattformen und modifizierten Oberflächen
enemy-alert-charted-areas-only=Erhalte Warnungen nur, wenn die Aktivität in einem von deiner Streitmacht kartierten Chunk stattfindet. Eine aktuelle Radarabdeckung ist nicht erforderlich

[controls]
enemy-alert-pollution-toggle=Warnung zur Schadstoffabsorption umschalten
