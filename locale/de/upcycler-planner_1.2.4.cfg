[mod-name]
upcycler-planner=Upcycler-Planer

[mod-description]
upcycler-planner=Wähle einen Gegenstand und eine Zielqualität aus – die Mod entwirft einen vollständig konfigurierbaren Bauplan für einen Upcycling-Kreislauf und stellt ihn dir zur Verfügung.
[shortcut-name]
upl-open=Upcycler-Planer

[shortcut-description]
upl-open=Entwirf einen Upcycling-Kreislauf und erhalte ihn als Bauplan.

[controls]
upl-open=Upcycler-Planer ein-/ausschalten

[upl-gui]
title=Upcycler-Planer
settings=Einstellungen
settings-tooltip=Nicht erforschte Gegenstände und versteckte Herstellungsoptionen anzeigen.
recipe=Zu upcyclender Gegenstand
recipe-tooltip=Nur Gegenstände, die zu ihren eigenen Zutaten recycelt werden können, können in dem Kreislauf verarbeitet werden.
quality=Zielqualität
quality-tooltip=Der Kreislauf verbessert sich jeweils um eine Stufe, bis zu dieser Qualität.
machine=Herstellungsmaschine
machine-tooltip=Eine pro Qualitätsstufe. Die hier angegebene Qualität bezieht sich auf die Maschine selbst, nicht auf die von ihr hergestellten Gegenstände.
recycler=Wiederverwerter
recycler-tooltip=Einer pro Stufe unterhalb deiner Zielqualität, der Gegenstände wieder in Zutaten zerlegt. Die hier angegebene Qualität bezieht sich auf den Wiederverwerter selbst.
requests=Zutatenmengen
requests-tooltip=Wie viele Einheiten jeder Zutat die Kiste des Kreislaufes von Ihrem Logistiknetzwerk anfordern.
requests-edit=Bearbeiten…
requests-edit-tooltip=Legen Sie fest, wie viele Minuten an Zutaten der Kreislauf anfordert oder wie viel von jeder Zutat benötigt wird.
requests-title=Zutatenmengen
feed-minutes=Minuten
feed-minutes-tooltip=Jede Zutat wird für etwa diese Anzahl an Minuten der Herstellung angefordert. Wenn du diesen Wert änderst, werden die unten stehenden Mengen zurückgesetzt.
request-count-tooltip=Wie viele Zutateinheiten werden pro Stufe angefordert? Leere das Feld und drücke die Eingabetaste, um wieder die Minutenanzahl zu übernehmen.
columns=Linien pro Stufe
columns-tooltip=Wie viele Linien sich in jeder niedrigeren Stufe wiederholen. Standardmäßig jeweils eine.
columns-edit=Bearbeiten…
columns-edit-tooltip=Legen Sie fest, wie viele Linien sich in jeder niedrigeren Stufe wiederholen.
columns-title=Linien pro Stufe
columns-count-tooltip=Wie viele Linien sich in dieser Ebene wiederholen, bis zu __1__. Lassen Sie das Feld leer und drücken Sie die Eingabetaste, um den Wert auf eins zurückzusetzen.
columns-no-lower-tier=Die niedrigste Qualität hat keine darunterliegende Stufe, die sich wiederholt.
build-options=Bauoptionen
group-transport=Transport
group-chests=Kisten
group-modules=Module
group-beacons=Effektverteiler
group-power=Energie
group-circuits=Schaltkreise
belt=Förderband
belt-tooltip=Befördert Gegenstände um dem Kreislauf herum. Förderbänder haben keinen Qualitätsbonus, daher gibt es keinen auszuwählen.
inserter=Greifarme
inserter-tooltip=Nur Greifarme, die ein Feld erreichen, passen in das Layout. Höhere Qualität bedeutet schnellere Bewegung.
requester=Zutatenkiste
requester-tooltip=Fordert die Zutaten für jede Maschine aus deinem Logistiknetzwerk an. Höhere Qualität bietet mehr Platz.
stock=Vorratskiste
stock-tooltip=Bewahrt die Gegenstände jeder Stufe auf, bis der Recycler sie entnimmt. Höhere Qualität bietet mehr Platz.
container=Relaiskiste
container-tooltip=Leitet Zutaten, die über ihre Stufe hinaus sind, zurück auf das Förderband. Höhere Qualität bietet mehr Platz.
provider=Ausgabekiste
provider-tooltip=Ein passiver Anbieter für deine fertigen Gegenstände. Je höher die Qualität, desto mehr passt hinein.
overflow=Überlauf-Kiste
overflow-tooltip=Roboter entfernen alles, was der Kreislauf über deiner Zielqualität auswirft. Je höher die Qualität, desto mehr passt hinein.
quality-module=Qualitätsmodul
quality-module-tooltip=Wird in jeden Recycler und in die unteren Maschinen eingesetzt. Eine höhere Qualität erhöht die Wahrscheinlichkeit.
terminal-module=Modul für die Endmaschine
terminal-module-tooltip=Wird nur bei Erreichen der Zielqualität in die Maschine eingesetzt. Da dort keine höhere Qualität mehr erreicht werden kann, wird standardmäßig die Produktivität gesteigert. Sie können das Feld leer lassen.
productivity-module=Produktivitätsmodul
productivity-module-tooltip=Wird in die unteren Maschinen neben den Qualitätsmodulen im optimalen Verhältnis eingesetzt. Leer lassen, wenn hier noch kein Produktivitätsmodul funktioniert.
split-enabled=Produktivitätsmodule mischen
split-enabled-tooltip=Mischt Produktivitätsmodule in die Maschinen unterhalb deiner Zielqualität im für deine Konfiguration optimalen Verhältnis ein. Deaktiviere diese Option, wenn du nur Qualitätsmodule verwenden möchtest.
split-edit=Verhältnisse…
split-edit-tooltip=Wählen Sie das Produktivitätsmodul aus, das hinzugefügt werden soll, und legen Sie fest, wie viele davon jede Maschine dieser Stufe erhält.
split-title=Modulverhältnisse
split-count-tooltip=Wie viele Produktivitätsmodule erhält eine Maschine dieser Stufe? Der Rest enthält Qualitätsmodule. Leer lassen und Eingabetaste drücken, um das optimale Verhältnis zu erhalten.
split-of=von __1__ Steckplätzen
split-no-productivity=Hier funktionieren keine Produktivitätsmodule, daher erhält jede Maschine Qualitätsmodule.
pole=Strommast
pole-tooltip=Versorgt jedes Gebäude mit Strom. Höhere Qualität reicht weiter. Leer lassen, um keine Masten zu platzieren.
pipe=Rohr
pipe-tooltip=Versorgt die Maschinen mit Flüssigkeit. Verbinde deine Versorgung von einer der beiden Seiten aus mit einem unterirdischen Rohr. Kein Qualitätsbonus.
beacon=Effektverteiler
beacon-tooltip=Verstärkt die Maschinen und Wiederverwerter jeder Stufe und erweitert den Kreislauf. Höhere Qualität sorgt für eine stärkere Verstärkung. Deaktivieren Sie diese Option, um kein Effektverteiler zu platzieren.
beacon-module=Effektverteiler-Module
beacon-module-tooltip=Füllt jeden Effektverteiler. Standardmäßig auf Effizienz eingestellt, da Geschwindigkeitsmodule die Wahrscheinlichkeit für höhere Qualität verringern. Deaktivieren, um sie leer zu lassen.
beacon-count=Effektverteiler pro Stufe
beacon-count-tooltip=Wie viele Effektverteiler pro Stufe gestapelt werden. Zusätzliche Effektverteiler vergrößern die Breite nicht, und jeder einzelne trägt etwas weniger dazu bei.
circuit-enabled=Schaltkreisgrenzen
circuit-enabled-tooltip=Verkabelt den Kreislauf so, dass er stoppt, sobald das Maximum erreicht ist, und ein Minimum jeder niedrigeren Qualität beibehält. Beide über „Grenzen…“ einstellen.
circuit-limits=Grenzen...
circuit-limits-tooltip=Legen Sie das beibehaltene Minimum jeder Qualität sowie das Maximum fest.
circuit-limits-title=Schaltkreisgrenzen
circuit-min=Min
circuit-max=Max
circuit-keep-tooltip=Hält diese Anzahl an Gegenständen dieser Qualität auf Lager, bevor der Rest recycelt wird. 0 bedeutet keine Reserve.
circuit-max-tooltip=Der Kreislauf stoppt bei dieser Anzahl. Durch Entnehmen von Gegenständen wird er erneut gestartet. 0 bedeutet keine Begrenzung.
circuit-hand=Handgröße
circuit-hand-tooltip=Gegenstände, die die Reserve-Greifarme pro Schwung aufnehmen, „leer“ bedeutet, was deine Forschung für den gewählten Greifarm zulässt.
circuit-network=Das gesamte Logistiknetzwerk zählen
circuit-network-tooltip=Zählt Gegenstände der Zielqualität in deinem gesamten Logistiknetzwerk, nicht nur in der Ausgabekiste. Der Kreislauf läuft nur innerhalb der Reichweite der Robotorhangers.
circuit-paused=Pause starten
circuit-paused-tooltip=Schaltet den Begrenzer-Kombinator aus, sodass der Kreislauf wartet, bis du ihn wieder einschaltest.
buffer-stock=Pufferkisten verwenden
buffer-stock-tooltip=Gegenstände warten in Pufferkisten und stehen Logistik- und Bauroboter zur Verfügung. Deaktiviere diese Option, um Gegenstände in den Kreislauf zu behalten.
trash-unrequested=Nicht angeforderte Gegenstände löschen
trash-unrequested-tooltip=Roboter entfernen alles, was nicht von einer Kiste angefordert wurde, damit der Kreislauf nicht überlastet wird.
footprint=Grundfläche: __1__ x __2__ Kacheln
summary=__1__ Maschinen, __2__ __plural_for_parameter__2__{1=Wiederverwerter|rest=Wiederverwerter}__
yield=Etwa __1__ __2__ für einen __3____2__
time-seconds=Etwa ein __1____2__ pro __3__ __plural_for_parameter__3__{1=Sekunde|rest=Sekunden}__
time-minutes=Etwa ein __1____2__ pro __3__ Minuten
time-hours=Etwa ein __1____2__ pro __3__ Stunden
time-days=Etwa ein __1____2__ pro __3__ Tage
confirm=Platzieren
cancel=Abbruch
pick-a-recipe=Wähle einen Gegenstand zum Upcycling aus.

[mod-setting-name]
upcycler-planner-show-all=Nicht erforschte Gegenstände anzeigen
upcycler-planner-show-all-build-options=Alle Bauoptionen anzeigen

[mod-setting-description]
upcycler-planner-show-all=Alle Gegenstände, Maschinen und Gebäude im Planer anzeigen, unabhängig davon, ob sie erforscht wurden oder nicht.
upcycler-planner-show-all-build-options=Zeige alle Bauoptionen an, einschließlich der Kisten, der Effektverteilern und der Optionen mit nur einer Auswahlmöglichkeit.

[upl-message]
no-recycling-path=__1__ kann nicht in seine Bestandteile zurückverwertet werden.
recycling-mismatch=Beim Recycling von __1__ werden nicht die eigenen Bestandteile zurückgewonnen.
too-many-fluids=Nur Rezepte mit einer flüssigen Zutat können in einem Kreislauf verarbeitet werden.
machine-no-fluid-face=__1__ kann die Rohre in keiner Drehung erreichen.
no-pipe=Es wurde noch keine Rohre erforscht.
no-pipe-to-ground=Es wurde noch keine unterirdische Rohre erforscht.
too-many-ingredients==Dieses Rezept enthält mehr als __1__ Zutaten – die maximale Anzahl, die ein Kreislauf filtern kann.
inserter-too-few-filters=__1__ hat zu wenige Filterplätze: Dieses Rezept benötigt __2__ pro Greifarm. Wähle einen Greifarm mit mehr Steckplätzen.
only-fuelled-inserters=Jeder von dir erforschte Greifarmbenötigt Brennstoff. Erforsche zuerst einen elektrischen.
no-module-slots=__1__ hat keine Modul-Plätze.
no-quality-effect=__1__ kann keine Qualitätsmodule aufnehmen.
item-spoils=__1__ verdirbt, daher wird ein Teil davon im Kreislauf verrotten, bevor es dein Ziel erreicht.
quality-not-researched=Die Qualität __1__ wurde noch nicht erforscht. Der Kreislauf wird darauf warten.
recipe-not-researched=Dieses Rezept wurde noch nicht erforscht. Der Kreislauf wartet darauf.
planner-not-researched=Erfordert die Technologie __1__.
no-machine-available=Es gibt keine Maschine, die dieses Rezept herstellen kann.
no-recycler=Kein verwendbarer Wiederverwerter. Aktiviere „Alle Bauoptionen anzeigen“, um einen auszuwählen.
recycler-no-eject=__1__ kann sein Erzeugnis nicht in die darüber liegende Maschine auswerfen.
recycler-needs-wider-machine=__1__ benötigt eine Maschine, die mindestens __2__ Kacheln breit ist.
no-belt=Es wurden noch keine Förderbander erforscht.
no-chest=Es wurden noch keine Kisten erforscht.
no-logistic-chest=Anfrage- und Anbieter-Kisten wurden noch nicht erforscht.
no-active-provider=Es wurden noch keine aktiven Anbieterkisten erforscht.
no-buffer-chest=Es wurden noch keine Pufferkisten erforscht.
no-quality-module=Es wurden noch keine Qualitätsmodule erforscht.
module-not-accepted=__1__ kann nicht in __2__ eingesetzt werden.
module-not-accepted-by-recipe=__1__ kann in diesem Rezept nicht verwendet werden.
build-quality-not-researched=Eine deiner Auswahlen verwendet die Qualität __1__, die noch nicht erforscht wurde. Der Kreislauf wartet darauf.
no-pole-researched=Es wurden noch keine Strommasten erforscht. Der Kreislauf wird ohne Stromversorgung ankommen.
beacon-too-tall=__1__ ist zu groß, um innerhalb des Kreislaufes zu stehen.
beacon-out-of-reach=__1__ __1__ kann weder die Maschine noch den Wiederverwerter auf seiner Stufe erreichen.
consumers-unpowered=__1__ __plural_for_parameter__1__{1=Gebäude ist|rest=Gebäude sind}__ befinden sich außerhalb des Versorgungsbereichs. Wähle einen Strommast mit größerer Reichweite oder versorge __plural_for_parameter__1__{1=es|rest=sie}__ selbst mit Strom.
circuit-unlinked=__1__ __plural_for_parameter__1__{1=Gebäude ist|rest=Gebäude sind}__ zu weit entfernt für ein Signalkabel und läuft daher unbegrenzt.
circuit-min-too-big=Das __1__ Minimum plus die Handgröße übersteigt die Kapazität der Vorratskiste. Wähle eine größere Kiste, ein niedrigeres Minimum oder eine kleinere Hand.
request-too-big=Die Zutatenmengen benötigen __1__ Plätze, aber die Zutatenkiste hat nur __2__. Wähle weniger Minuten oder eine größere Kiste.
no-cursor=Du benötigst einen Charakter, um die Blaupause zu halten.
cursor-full=Kein Platz für die Blaupause. Mache einen Platz im Inventar frei und versuche es erneut.
plan-failed=Planung fehlgeschlagen. Öffne den Planer erneut und versuche es noch einmal.
no-logistic-connection=__1__ kann sich zu keinem Logistiknetzwerk verbinden. Deaktiviere „Gesamtes Logistiknetzwerk zählen“ oder wähle eine andere Maschine aus.