[item-group-name]
circuit=Schaltkreise

[mod-setting-name]
Schall-CGP-order=Reihenfolge der Gruppenregisterkarten
Schall-CGP-individual-combinator-subgroups=Einzelne Kombinator-Untergruppen

[mod-setting-description]
Schall-CGP-order=aw: (Standard) Nach der Registerkarte „Logistik“.\ndw: Nach der Registerkarte „Kampf“.

[mod-name]
SchallCircuitGroup=Schall Circuit Group

[mod-description]
SchallCircuitGroup=PStellt eine separate neue Registerkarte „Schaltkreis“ bereit, die alle Standard-Schaltkreiskomponenten und alle bereits in der Untergruppe „Schaltkreisnetzwerk“ enthaltenen Gegenstände enthält.\nDient als Rahmen, um alle schaltkreisbezogenen Gegenstände zusammenzufassen.\nEntwickelt für Spieler, die versucht haben, Schaltkreiskomponenten auf der Registerkarte „Logistik“ zu finden.
