[mod-name]
aai-vehicles-ironclad=AAI Vehicles: Ironclad

[mod-description]
aai-vehicles-ironclad=Ein schweres, metallgepanzertes Boot, das mit einem Fernkampf-Mörser und einer Kanone bewaffnet ist. Dank seiner großzügigen Ladekapazität kannst du Gegenstände zwischen den Inseln transportieren. Die Waffen können sowohl Mörser- als auch Panzermunition verwenden. Am einfachsten lässt sich das „Ironclad“ in seichtem Wasser (Mod „Alien Biomes“) betreten und verlassen.

