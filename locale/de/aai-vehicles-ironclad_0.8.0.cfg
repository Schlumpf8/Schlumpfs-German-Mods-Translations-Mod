mortar-bomb=Ein Sprengkörper mit sehr großer Reichweite und bogenförmiger Flugbahn.
mortar-cluster-bomb=Ein Sprengkörper mit großer Reichweite und bogenförmiger Flugbahn, der sich in mehrere Teile aufspaltet.
ironclad-cannon=Feuert Kanonengeschosse mit mittlerer Reichweite und flacher Flugbahn ab.
ironclad-mortar=Feuert Mörsergranaten mit großer Reichweite und steiler Flugbahn ab.

