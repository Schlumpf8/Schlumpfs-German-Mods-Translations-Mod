[mod-setting-description]
aai-containers-resize-1x1=Sorgt für einen einheitlichen Abstand zwischen den Containern, durch die man hindurchgehen kann.
aai-containers-scale-icons=Das über dem Behälter angezeigte Alternativ-Symbol wird entsprechend der Grundfläche des Behälters vergrößert.
aai-containers-progression=Inventargröße von Holzkiste, Eisenkiste, Stahlkiste, große Kiste Depot, großes Depot. CD = Consistent density (Gleichbleibende Dichte) pro Kachel für Stahl und höher. Warnung: Container mit hoher Inventargröße verringern die UPS; es wird davon abgeraten, die maximale Inventargröße von 540 zu überschreiten.
aai-containers-number-icons=Standardmäßig wird die Containergröße als Zahl oben links auf dem Symbol angezeigt.

