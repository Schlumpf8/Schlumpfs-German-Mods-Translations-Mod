[controls]
toggle-inventory-gauge=Inventar-Anzeige umschalten

[shortcut]
toggle-inventory-gauge=Inventar-Anzeige umschalten

[mod-name]
internal-mod-name=Inventar-Anzeige

[mod-description]
internal-mod-name=Eine Mod, die eine verschiebbare Anzeige deiner Inventarkapazität auf dem Bildschirm anzeigt.

[mod-setting-name]
inventory-gauge-occupied=Farbe der belegten Plätze
inventory-gauge-partial=Farbe der teilweise gefüllten Plätze
inventory-gauge-reserved=Farbe der reservierten Plätze
inventory-gauge-free=Farbe der freien Plätze
inventory-gauge-text=Textfarbe
inventory-gauge-center-on-open=Fenster beim Öffnen zentrieren
inventory-gauge-auto-hide-on-hover=Automatisch ausblenden beim Bewegen des Mauszeigers über ein Objekt
inventory-gauge-overlay-format=Format des Overlay-Textes
inventory-gauge-log-level=Protokollierungsstufe

[mod-setting-description]
inventory-gauge-occupied=Farbe für belegte Inventarplätze
inventory-gauge-partial=Farbe für teilweise gefüllte Inventarplätze
inventory-gauge-reserved=Farbe für reservierte (gefilterte) Inventarplätze
inventory-gauge-free=Farbe für freie Inventarplätze
inventory-gauge-text=Farbe für den Text im Inventarfenster
inventory-gauge-center-on-open=Aktiviert: wird das Inventarfenster immer zentriert geöffnet. Deaktiviert: wird es an der Position wieder geöffnet, an der du es zuletzt geschlossen hast.
inventory-gauge-auto-hide-on-hover=Aktiviert: wird das Inventarfenster automatisch ausgeblendet, sobald du mit dem Mauszeiger über Objekte in der Spielwelt fährst, und wieder eingeblendet, sobald du den Mauszeiger wegbewegst.
inventory-gauge-overlay-format=Vorlage für die Overlay-Beschriftung. Einheiten: %F volle Stapel, %P teilweise gefüllte Stapel, %U belegte (nicht leere) Plätze, %R reservierte (gefilterte) Plätze, %E freie leere Plätze, %T Gesamtzahl der Plätze, %I prozentuale Auslastung, %% buchstäbliches Prozentzeichen.
inventory-gauge-log-level=Protokollierungsausführlichkeit. „None“ deaktiviert die Protokollierung. „Debug“ aktiviert eine detaillierte Protokollausgabe.
